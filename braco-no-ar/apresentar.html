<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23132a27'/%3E%3Crect x='7' y='14' width='4' height='11' rx='2' fill='%23e3562d'/%3E%3Crect x='14' y='7' width='4' height='18' rx='2' fill='%23fdc200'/%3E%3Crect x='21' y='11' width='4' height='14' rx='2' fill='%233ea6d5'/%3E%3C/svg%3E">
<title>Apresentar · Braço no Ar</title>
<link rel="stylesheet" href="palco.css">
<link rel="stylesheet" href="telemovel.css">
<style>
  :root{--escuro:#132a27;--amarelo:#fdc200;--creme:#f3eee5;--teal:#1e7e75;--vermelho:#e3562d;--display:'Anton',Impact,sans-serif;--texto:'Archivo',system-ui,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--texto);background:var(--fundo-pag,#132a27);transition:background .4s}
  #app{position:fixed;inset:0;display:flex}
  #palco-wrap{position:relative;flex:1;overflow:hidden}
  body.ver #ctl,body.ver #selo:empty{display:none!important}
  #tel[hidden]{display:none!important}
  #tel{flex:none;width:420px;background:#0c1b19;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;border-left:1px solid rgba(255,255,255,.08)}
  #tel .moldura{width:350px;height:min(720px,calc(100vh - 90px));border-radius:42px;background:#000;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #tel-ecra{width:100%;height:100%;border-radius:32px;overflow:auto;display:flex;flex-direction:column;background:#fff}
  #tel-ecra>.ph{flex:1}
  #tel>p{margin:0;color:rgba(255,255,255,.6);font-size:13px;text-align:center;max-width:330px;line-height:1.4}

  #ctl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;background:rgba(10,20,18,.94);color:#fff;border-radius:999px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .35s;z-index:20;font-size:14px;max-width:calc(100vw - 24px);overflow-x:auto}
  #ctl.escondido{opacity:0;pointer-events:none}
  #ctl button{all:unset;cursor:pointer;padding:9px 13px;border-radius:999px;font-weight:600;white-space:nowrap}
  #ctl button[hidden]{display:none}
  #ctl button:hover{background:rgba(255,255,255,.1)}
  #ctl button:focus-visible{outline:2px solid var(--amarelo)}
  #ctl button:disabled{opacity:.35;cursor:default}
  #ctl .pos{padding:0 8px;color:rgba(255,255,255,.65);font-variant-numeric:tabular-nums;min-width:58px;text-align:center;cursor:pointer}
  #ctl .sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 2px;flex:none}
  #ctl .prim{background:var(--amarelo);color:var(--escuro)}
  #ctl .prim:hover{background:#ffd43a}
  #selo{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:21;font:700 13px/1.2 var(--texto);letter-spacing:.02em;padding:8px 14px;border-radius:999px;display:none;cursor:pointer;max-width:90vw;text-align:center}
  #selo.demo{display:block;background:var(--amarelo);color:var(--escuro)}
  #selo.erro{display:block;background:var(--vermelho);color:#fff}
  #selo.leitura{display:block;background:#fff;color:var(--escuro)}
  #aviso{position:fixed;top:54px;left:50%;transform:translate(-50%,-8px);z-index:21;font:700 14px/1.2 var(--texto);padding:10px 16px;border-radius:12px;background:var(--teal);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  #aviso.on{opacity:1;transform:translate(-50%,0)}

  /* temporizador (dentro do palco, por isso escala com ele) */
  .crono[hidden]{display:none}
  .crono{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:12px;padding:7px 24px 7px 9px;border-radius:999px;background:rgba(10,20,18,.94);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3);font-family:var(--texto)}
  .crono svg{width:48px;height:48px;transform:rotate(-90deg);flex:none}
  .crono circle{fill:none;stroke-width:9}
  .crono .f{stroke:rgba(255,255,255,.16)}
  .crono .a{stroke:var(--t-acento,#fdc200);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .crono b{font-family:var(--display);font-weight:400;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
  .crono span{font-size:17px;font-weight:600;color:rgba(255,255,255,.75);max-width:380px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crono.urgente .a{stroke:#ff6a4d}
  .crono.urgente b{color:#ff8a70}
  .crono.fim{background:var(--vermelho);animation:pulsar .9s ease-in-out 3}
  .crono.fim svg{display:none}
  @keyframes pulsar{50%{transform:translateX(-50%) scale(1.06)}}

  /* QR em grande para quem chega atrasado */
  .juntar{position:absolute;inset:0;z-index:7;background:rgba(10,20,18,.96);display:flex;align-items:center;justify-content:center;gap:90px;color:#fff;cursor:pointer}
  .juntar .q{width:560px;height:560px;background:#fff;border-radius:28px;padding:22px}
  .juntar .q svg{display:block;width:100%;height:100%}
  .juntar p{margin:0;font-family:var(--display);font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--t-acento,#fdc200)}
  .juntar .site{font-family:var(--display);font-size:60px;line-height:1.05;margin:14px 0 30px}
  .juntar .cod{font-family:var(--display);font-size:190px;line-height:.9;letter-spacing:.04em;color:var(--t-acento,#fdc200)}
  .juntar small{display:block;margin-top:34px;font-size:20px;font-weight:600;color:rgba(255,255,255,.6)}

  dialog{border:0;border-radius:18px;padding:0;width:min(640px,92vw);max-height:88vh;font-family:var(--texto);color:var(--escuro);background:var(--creme);box-shadow:0 30px 80px rgba(0,0,0,.45)}
  dialog::backdrop{background:rgba(5,12,11,.6)}
  .dlg{padding:26px 28px 22px;overflow:auto;max-height:88vh}
  .dlg h2{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;margin:0 0 6px}
  .dlg h3{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:22px 0 8px}
  .dlg p{margin:0 0 8px;line-height:1.5;font-size:15px}
  .dlg code{display:block;background:#fff;border:1px solid rgba(19,42,39,.15);border-radius:8px;padding:10px 12px;font-size:13px;word-break:break-all;margin:6px 0 8px}
  .dlg .bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .dlg button{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:9px;border:1px solid rgba(19,42,39,.2);background:#fff;color:var(--escuro);cursor:pointer}
  .dlg button.prim{background:var(--teal);border-color:var(--teal);color:#fff}
  .dlg button.perigo{border-color:var(--vermelho);color:var(--vermelho)}
  .dlg ul{margin:4px 0 0;padding-left:18px;line-height:1.75;font-size:14px}
  .dlg kbd{font:600 12px/1 var(--texto);background:#fff;border:1px solid rgba(19,42,39,.25);border-bottom-width:2px;border-radius:5px;padding:2px 6px}
  .dlg .fechar{float:right;border:0;background:transparent;font-size:24px;line-height:1;padding:2px 6px}
  .dlg .predef{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .dlg .predef button{padding:16px 10px;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.03em}
  .dlg .linha-tempo{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .dlg input{font:inherit;font-size:15px;padding:9px 12px;border-radius:9px;border:1px solid rgba(19,42,39,.25);background:#fff}
  .ir{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
  .ir button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;border:0!important;background:transparent!important;padding:10px 10px!important;border-radius:10px!important}
  .ir button:hover,.ir button.atual{background:#fff!important}
  .ir .n{font-family:var(--display);font-size:18px;color:var(--teal);width:30px}
  .ir .tp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(19,42,39,.55);width:130px;flex:none}
  .ir .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .cortina{position:fixed;inset:0;z-index:30;background:var(--escuro);color:#fff;display:grid;place-items:center;padding:24px;font-family:var(--texto)}
  .cortina .caixa{max-width:560px;width:100%}
  .cortina h1{font-family:var(--display);font-weight:400;font-size:52px;text-transform:uppercase;line-height:1;margin:0 0 14px}
  .cortina p{font-size:17px;line-height:1.5;color:rgba(255,255,255,.75);margin:0 0 18px}
  .cortina .opcoes{display:flex;flex-direction:column;gap:10px}
  .cortina button,.cortina a{all:unset;cursor:pointer;display:block;padding:16px 18px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:16px;line-height:1.4}
  .cortina button:hover,.cortina a:hover{background:rgba(255,255,255,.14)}
  .cortina button:focus-visible,.cortina a:focus-visible{outline:3px solid var(--amarelo)}
  .cortina button b{display:block;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;text-transform:uppercase;color:var(--amarelo)}
  .cortina .prim{background:var(--amarelo);color:var(--escuro);border-color:var(--amarelo)}
  .cortina .prim b{color:var(--escuro)}
</style>
</head>
<body>
<div id="app">
  <div id="palco-wrap"><div id="palco" class="palco"></div></div>
  <aside id="tel" hidden aria-label="Telemóvel de teste">
    <div class="moldura"><div id="tel-ecra"></div></div>
    <p>Telemóvel de teste. Responde aqui como se fosses um participante.</p>
  </aside>
</div>
<div id="selo" role="status"></div>
<div id="aviso" role="status" aria-live="polite"></div>
<nav id="ctl" aria-label="Controlos">
  <button id="b-ant" title="Anterior (←)">‹</button>
  <span class="pos" id="b-pos" title="Ir para… (G)">–</span>
  <button id="b-seg" class="prim" title="Seguinte (→ ou espaço)">Seguinte ›</button>
  <span class="sep"></span>
  <button id="b-acao" hidden></button>
  <button id="b-ocultar" title="Esconder ou mostrar resultados (H)" hidden>Esconder</button>
  <button id="b-tempo" title="Temporizador (T)">⏱ Tempo</button>
  <button id="b-qr" title="Código e QR em grande (Q)">QR</button>
  <span class="sep"></span>
  <button id="b-tel" title="Telemóvel de teste" hidden>📱</button>
  <button id="b-ecra" title="Ecrã inteiro (F)">⛶</button>
  <button id="b-defs" title="Sessão, link e atalhos">⚙</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlg-c"></div></dialog>

<script>window.BNA_PAPEL = "ecra";</script>
<script src="config.js"></script>
<script src="qrcode.min.js"></script>
<script src="nucleo.js"></script>
<script src="tipos.js"></script>
<script src="tela.js"></script>
<script src="resultados.js"></script>
<script src="modelos.js"></script>
<script src="participante.js"></script>
<script>
(function () {
  "use strict";
  var B = window.BNA, el = B.el, T = B.tipos, db = B.db, cam = B.caminho;
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var aid = q.get("a");
  var uid = null, at = null, atJson = "", tema = null, codigo = null;
  var estado = { i: -1 };
  var resp = {}, parts = {}, extra = {};
  var inicios = {};               /* início de cada quiz (hora do servidor) */
  var vista = null, ligacao = { ok: true, msg: "" };
  var soLeitura = false;          /* sessão terminada aberta só para mostrar resultados */
  var livreVer = -1;              /* questionário: -1 = painel; senão, o diapositivo cujos resultados se mostram */
  var juntarAberto = false;
  var fixo = null;                /* código fixo da atividade: é este que aparece no ecrã e no QR */
  var ver = (q.get("ver") || "").replace(/\D/g, "");   /* visualizador: só acompanha, sem comandos */
  function codPub() { return fixo || codigo; }

  function livre() { return at && at.ritmo === "livre"; }

  /* ---------------- arranque ---------------- */
  function cortina(titulo, texto, opcoes) {
    var c = el("div", { class: "cortina" }, el("div", { class: "caixa" }, el("h1", null, titulo), texto ? el("p", null, texto) : null,
      opcoes ? el("div", { class: "opcoes" }, opcoes) : null));
    document.body.appendChild(c);
    var b = c.querySelector("button,a"); if (b) setTimeout(function () { try { b.focus(); } catch (e) {} }, 30);
    return c;
  }

  if (ver) arrancarVer(ver);
  else {
  if (B.demo && !B.auth.ativo()) B.auth.entrar("demo@exemplo.pt", "");
  if (!B.auth.ativo()) {
    cortina("Entra primeiro", "Para apresentar, entra com a tua conta de formador.", [el("a", { class: "prim", href: "formador.html" }, "Ir para a página de entrada")]);
    return;
  }
  uid = B.auth.uid();
  var preparar = Promise.resolve();
  function gravarModelo(mod) {
    var atm = B.deModelo(mod);
    return db.put(cam.atividade(uid, "demo" + mod), { titulo: atm.titulo, tema: atm.tema, n: atm.slides.length, alterado: Date.now(), dados: JSON.stringify(atm) }, { auth: true });
  }
  if (!aid && B.demo) {
    /* demonstração sem biblioteca: usa um modelo (#raiox, #avaliacao ou #todos), sempre acabado de criar */
    var h = location.hash;
    var mod = /raiox/.test(h) ? "raiox" : /avalia/.test(h) ? "avaliacao" : /todos/.test(h) ? "todos" : (B.store.get("bna-demo-modelo") || "todos");
    aid = "demo" + mod;
    preparar = gravarModelo(mod);
  } else if (B.demo && /^demo(raiox|todos|avaliacao)$/.test(aid)) {
    /* recarregar a página da demonstração: se o browser não guardou nada, volta a criar o modelo */
    preparar = db.get(cam.atividade(uid, aid), { auth: true }).then(function (reg) { if (!reg || !reg.dados) return gravarModelo(aid.slice(4)); });
  }
  if (!aid) { cortina("Falta a atividade", "Abre a apresentação a partir da tua biblioteca.", [el("a", { class: "prim", href: "formador.html" }, "Ir para a biblioteca")]); return; }

  preparar.then(function () { return db.get(cam.atividade(uid, aid), { auth: true }); }).then(function (reg) {
    if (!reg || !reg.dados) throw new Error("Não encontrámos esta atividade na tua biblioteca.");
    atJson = reg.dados;
    at = JSON.parse(reg.dados);
    at.slides = at.slides || [];
    tema = B.tema(at.tema);
    B.aplicarTema($("palco"), at.tema);
    document.title = (at.titulo || "Atividade") + " · " + B.nome;
    return db.get(cam.indiceSessoes(uid), { auth: true });
  }).then(function (sessoes) {
    if (!at) return;
    var pedida = q.get("s"), lista = [];
    for (var c in sessoes || {}) if (sessoes[c] && sessoes[c].a === aid) lista.push({ c: c, criada: sessoes[c].criada || 0, fim: sessoes[c].fim });
    lista.sort(function (a, b) { return b.criada - a.criada; });
    if (q.get("nova") === "1") return criarSessao();
    if (pedida && lista.some(function (x) { return x.c === pedida; })) return abrirPedida(pedida);
    var recente = lista.filter(function (x) { return !x.fim && Date.now() - x.criada < 16 * 3600 * 1000; })[0];
    if (!recente || B.demo) return criarSessao();
    var cort = cortina("Apresentar", "Já tens uma sessão desta atividade aberta hoje.", [
      el("button", { class: "prim", onclick: function () { cort.remove(); retomar(recente.c); } }, el("b", null, "Continuar a sessão " + B.fmtCodigo(recente.c)), "Mantém as respostas que já entraram (" + B.data(recente.criada) + ")."),
      el("button", { onclick: function () { cort.remove(); criarSessao(); } }, el("b", null, "Começar uma sessão nova"), "Código novo, sem respostas.")
    ]);
  }).catch(function (e) {
    cortina("Não foi possível abrir", e.message || String(e), [el("a", { class: "prim", href: "formador.html" }, "Voltar à biblioteca")]);
  });
  }

  /* ---------------- visualizador (ligação partilhada, sem conta) ---------------- */
  var cortinaVer = null;
  function arrancarVer(c) {
    document.body.classList.add("ver");
    db.get(cam.sessao(c) + "/conteudo").then(function (cont) {
      if (cont) return sessaoVer(c, null);
      return db.get(cam.fixo(c)).then(function (fx) {
        if (!fx || !fx.dono) { if (!cortinaVer) cortinaVer = cortina("Não encontrámos esta apresentação", "Confirma a ligação que te enviaram."); return; }
        if (fx.s) return sessaoVer(String(fx.s), c);
        if (!cortinaVer) cortinaVer = cortina(fx.t || "Ainda não começou", "A apresentação aparece aqui sozinha quando a formadora começar.");
        setTimeout(function () { arrancarVer(c); }, 4000);
      });
    }).catch(function () { setTimeout(function () { arrancarVer(c); }, 5000); });
  }
  function sessaoVer(c, f) {
    return db.get(cam.sessao(c)).then(function (sess) {
      if (!sess || !sess.conteudo) throw new Error("Sessão sem conteúdo.");
      if (cortinaVer) { cortinaVer.remove(); cortinaVer = null; }
      codigo = c; fixo = f; uid = sess.dono; soLeitura = false;
      at = JSON.parse(sess.conteudo); at.slides = at.slides || [];
      tema = B.tema(at.tema); B.aplicarTema($("palco"), at.tema);
      document.title = (at.titulo || "Apresentação") + " · " + B.nome;
      estado = sess.estado || { i: -1 };
      var cvVer = estado.cv;
      db.ouvir(cam.respostas(codigo), function (d, ok, err) { resp = d || {}; setLigacao(ok, err); pedir(); });
      db.ouvir(cam.participantes(codigo), function (d) { parts = d || {}; pedir(); });
      db.ouvir(cam.sessao(codigo) + "/x", function (d) {
        extra = d || {};
        if (extra.inicios) for (var k in extra.inicios) if (typeof extra.inicios[k] === "number") inicios[k] = extra.inicios[k];
        quizVer();
        pedir();
      });
      db.ouvir(cam.sessao(codigo) + "/estado", function (e, ok) {
        if (!ok) return;
        var antes = estado.i + "|" + estado.id + "|" + (estado.rev ? 1 : 0) + "|" + (estado.oc ? 1 : 0) + "|" + JSON.stringify(estado.rol || null);
        estado = e || { i: -1 };
        if (estado.fim) { if (!cortinaVer) cortinaVer = cortina("A apresentação terminou", "Obrigado por acompanhares."); return; }
        if (estado.cv && cvVer && estado.cv !== cvVer) {
          cvVer = estado.cv;
          db.get(cam.sessao(codigo) + "/conteudo").then(function (x) { try { at = JSON.parse(x); at.slides = at.slides || []; tema = B.tema(at.tema); B.aplicarTema($("palco"), at.tema); } catch (er) {} quizVer(); desenhar(); });
          return;
        }
        quizVer();
        var depois = estado.i + "|" + estado.id + "|" + (estado.rev ? 1 : 0) + "|" + (estado.oc ? 1 : 0) + "|" + JSON.stringify(estado.rol || null);
        if (antes !== depois) desenhar(); else atualizar();
      });
      quizVer();
      ajustar();
      desenhar();
      atualizarSelo();
      setInterval(tickCrono, 250);
    }).catch(function (e) { cortina("Não foi possível abrir", (e && e.message) || String(e)); });
  }
  /* o conteúdo público não traz a resposta certa: chega no estado quando é revelada */
  function quizVer() {
    var certas = (extra && extra.certas) || {};
    (at && at.slides || []).forEach(function (x) { if (x.tipo === "quiz" && certas[x.id] && typeof certas[x.id].c === "number") { x.certa = certas[x.id].c; x.explicacao = certas[x.id].e || ""; } });
    var s = slideAtual();
    if (s && s.tipo === "quiz" && estado.rev && typeof estado.qc === "number") { s.certa = estado.qc; s.explicacao = estado.qe || ""; }
  }

  function estadoInicial() {
    var e = { i: -1, cv: Date.now() };
    if (livre()) e.modo = "livre";
    return e;
  }
  function criarSessao(tent) {
    tent = tent || 0;
    var c = B.novoCodigo();
    return Promise.all([db.get(cam.sessao(c) + "/dono"), db.get(cam.fixo(c) + "/dono")]).then(function (r) {
      var d = r[0] || r[1];
      if (d && tent < 6) return criarSessao(tent + 1);
      codigo = c;
      estado = estadoInicial();
      var s = { dono: uid, atividade: aid, titulo: at.titulo || "", criada: { ".sv": "timestamp" }, ativa: true,
        conteudo: JSON.stringify(B.conteudoPublico(at)), estado: estado };
      return db.put(cam.sessao(c), s, { auth: true }).then(function () {
        return db.put(cam.indiceSessao(uid, c), { a: aid, titulo: at.titulo || "", criada: { ".sv": "timestamp" }, conteudo: JSON.stringify(at) }, { auth: true });
      }).then(comecar);
    }).catch(erroFatal);
  }
  /* uma sessão pedida pelo endereço: se já terminou, pergunta o que fazer */
  function abrirPedida(c) {
    return db.get(cam.sessao(c), { auth: true }).then(function (s) {
      if (!s) return criarSessao();
      var terminou = s.ativa === false || (s.estado && s.estado.fim);
      if (!terminou) return retomar(c, s);

          extra = s.x || {};
          for (var k in extra.inicios || {}) if (typeof extra.inicios[k] === "number") inicios[k] = extra.inicios[k];
          estado = { i: -1 };
          comecar();
          if (!livre() && at.slides.length) ir(0);
        } }, el("b", null, "Mostrar os resultados"), "Percorres os diapositivos no ecrã. A sessão continua fechada para os telemóveis."),
        el("button", { onclick: function () { cort.remove(); retomar(c, s); } }, el("b", null, "Reabrir a sessão"), "Os participantes podem voltar a responder, com o mesmo código."),
        el("button", { onclick: function () { cort.remove(); criarSessao(); } }, el("b", null, "Começar uma sessão nova"), "Código novo, sem respostas.")
      ]);

  }
  function retomar(c, s) {
    codigo = c;
    var obter = s ? Promise.resolve(s) : db.get(cam.sessao(c), { auth: true });
    return obter.then(function (s) {
      if (!s) return criarSessao();
      estado = s.estado || { i: -1 };
      delete estado.fim;
      if (typeof estado.i === "number" && estado.i >= 0) {
        var pos = at.slides.map(function (x) { return x.id; }).indexOf(estado.id);
        estado.i = pos >= 0 ? pos : Math.min(estado.i, at.slides.length - 1);
        estado.id = at.slides[estado.i] ? at.slides[estado.i].id : null;
      }
      if (livre()) estado.modo = "livre"; else delete estado.modo;
      estado.cv = Date.now();

  function comecar() {

    db.ouvir(cam.respostas(codigo), function (d, ok, err) { resp = d || {}; setLigacao(ok, err); pedir(); });
    db.ouvir(cam.participantes(codigo), function (d) { parts = d || {}; pedir(); });
    db.ouvir(cam.sessao(codigo) + "/x", function (d) {
      extra = d || {};

      db.ouvir(cam.atividade(uid, aid) + "/dados", function (d, ok) { if (ok) aoMudarAtividade(d); }, { auth: true, intervalo: 6000 });
      /* acerta o relógio com o servidor (para o tempo do quiz ser igual em todos os aparelhos) */

        var t1 = Date.now();

      }).catch(function () {});
    }
    ajustar();
    desenhar();

      }).then(function () { qrCache = {}; desenhar(); if (juntarAberto) alternarJuntar(true); }).catch(function () {});
    }
  }

  function aoMudarAtividade(dados) {
    if (!dados || typeof dados !== "string" || dados === atJson) return;
    var novo;
    try { novo = JSON.parse(dados); } catch (e) { return; }
    atJson = dados;
    var idAtual = estado.id;
    at = novo; at.slides = at.slides || [];
    tema = B.tema(at.tema); B.aplicarTema($("palco"), at.tema);
    document.title = (at.titulo || "Atividade") + " · " + B.nome;
    if (livre()) { estado.modo = "livre"; estado.i = -1; estado.id = null; }
    else {
      delete estado.modo;
      if (typeof estado.i === "number" && estado.i >= 0) {
        var pos = at.slides.map(function (x) { return x.id; }).indexOf(idAtual);
        if (pos >= 0) estado.i = pos;
        else irPara(Math.min(estado.i, at.slides.length - 1)); /* o diapositivo no ecrã foi apagado */
      }
    }
    if (livreVer >= at.slides.length) livreVer = -1;

      .then(function () { gravar(); }).catch(function () {});
    db.patch(cam.indiceSessao(uid, codigo), { conteudo: JSON.stringify(at) }, { auth: true }).catch(function () {});
    avisar("Atividade atualizada a partir do editor");
    desenhar();
  }

  /* ---------------- estado ---------------- */

  /* ---------------- dados para o diapositivo ---------------- */

      ocultos: s && extra.ocultos ? extra.ocultos[s.id] || {} : {}, respondidas: s && extra.respondidas ? extra.respondidas[s.id] || {} : {},

  /* pontos do quiz: escritos à parte; cada telemóvel lê só os seus */

  /* questionário ao ritmo de cada um: painel com o progresso de cada pergunta */

  function desenhar() {
    var s = slideAtual();
    rodapeDir = null;
    if (!s) vista = livre() ? vistaPainel() : vistaEntrada();
    else {
      var def = T[s.tipo];
      vista = def.ecra(s, {
        tema: tema, modo: livre() || soLeitura ? "resultados" : "vivo", atividade: at, canto: soLeitura ? null : canto, rodape: rodape,
        visualizador: !!ver,
        imagem: function (id) { return B.imagens.url(uid, id); },
        ocultar: soLeitura || ver ? null : function (chave) { db.put(cam.sessao(codigo) + "/x/ocultos/" + s.id + "/" + chave, true, { auth: true }).catch(function () {}); },
        responder: soLeitura || ver ? null : function (chave) {
          var feita = extra.respondidas && extra.respondidas[s.id] && extra.respondidas[s.id][chave];
          var caminho = cam.sessao(codigo) + "/x/respondidas/" + s.id + "/" + chave;
          (feita ? db.del(caminho, { auth: true }) : db.put(caminho, true, { auth: true })).catch(function () {});
        },
        inicio: function () { return estado.ini || inicios[s.id] || null; },
        revelado: function () { return !!estado.rev; },
        aoAcabar: livre() || soLeitura || ver ? null : function () { if (!estado.rev && !aRevelar) { aRevelar = true; setTimeout(function () { aRevelar = false; if (!estado.rev && slideAtual() === s) revelar(); }, 900); } },
        aoRodar: soLeitura || ver ? null : function (rol) {
          estado.rol = rol; gravar(); atualizarControlos();
          if (rol && rol.r >= 0) db.put(cam.sessao(codigo) + "/x/rol/" + s.id, rol, { auth: true }).catch(function () {});
        },

      });

    BNA.por($("palco"), vista.el, crono.el, juntarAberto ? vistaJuntar() : null);
    var sup = (vista.el.className.match(/sup-(\w+)/) || [])[1] || "escuro";
    document.body.style.setProperty("--fundo-pag", sup === "claro" ? tema.claro : sup === "destaque" ? tema.destaque : tema.escuro);
    atualizar();
    simSlide(s);

  var aRevelar = false;

  /* ---------------- navegação ---------------- */
  function ir(i) {
    if (livre()) { livreVer = i; desenhar(); return; }
    irPara(i);
    gravar();
    desenhar();
  }
  /* prepara o estado de um diapositivo (sem gravar nem desenhar) */
  function irPara(i) {
    i = Math.max(-1, Math.min(at.slides.length - 1, i));
    var s = at.slides[i];
    var novo = { i: i, id: s ? s.id : null, cv: estado.cv, rev: false, oc: !!(s && s.esconder), rol: null };
    if (estado.tmp) novo.tmp = estado.tmp;
    if (estado.pv) { novo.pv = estado.pv; novo.np = estado.np; }
    estado = novo;
    if (s && s.tipo === "quiz") {
      if (!inicios[s.id] && !soLeitura) {
        inicios[s.id] = B.agora();
        db.put(cam.sessao(codigo) + "/x/inicios/" + s.id, inicios[s.id], { auth: true }).catch(function () {});
      }
      if (inicios[s.id]) estado.ini = inicios[s.id];
      if (extra.revelados && extra.revelados[s.id]) { estado.rev = true; estado.qc = s.certa; estado.qe = s.explicacao || ""; publicarPontos(s); }

        var v = valorSimulado(s, i);
        if (v !== null) db.put(cam.resposta(codigo, s.id, chave), v);
        if (s.tipo === "perguntas" && i >= 8) {
          var chaves = Object.keys(resp[s.id] || {});
          if (chaves.length) db.put(cam.resposta(codigo, s.id + "g", id), chaves.filter(function () { return Math.random() < 0.35; }).slice(0, 3).join(",") || chaves[0]);
        }
      }, d));
    });
  }
})();
</script>
