  --f-marca:"Bagel Fat One", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-pergunta:"Young Serif", Georgia, "Times New Roman", serif;
  --f-ui:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--texto);font:16px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
  background:radial-gradient(ellipse 110% 85% at 50% 32%, var(--noite) 0%, var(--noite-funda) 100%) fixed, var(--noite-funda)}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brilho);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Estrutura ---------- */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#ambiente,#particulas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#ambiente{z-index:0}
#particulas{z-index:8}

.topo{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--f-marca);font-size:clamp(22px,2.6vw,30px);line-height:1;color:var(--massa-clara);margin:0;font-weight:400;letter-spacing:.01em}
.marca svg{width:46px;height:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.topo-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-topo{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--noite-borda);background:var(--noite-clara);color:var(--texto);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.btn-topo:hover{border-color:var(--massa-clara)}
.btn-topo.so-icone{width:42px;padding:0;justify-content:center}
.btn-topo[aria-pressed="false"]{color:var(--texto-suave)}
.chip-conj{max-width:min(46vw,340px)}
.chip-conj span{overflow:hidden;text-overflow:ellipsis}

/* ---------- Palco e prato ---------- */
.palco{position:relative;z-index:1;display:grid;place-items:center;min-height:0;overflow:hidden}
.prato-area{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.6vh,16px);width:100%;max-width:1240px;padding-block:4px 14px;min-height:0}
.titulo{font-family:var(--f-marca);font-weight:400;font-size:clamp(34px,5.6vw,68px);line-height:1;margin:0;text-align:center;text-wrap:balance;color:var(--texto)}
.subtitulo{color:var(--texto-suave);margin:0;font-size:clamp(15px,1.5vw,18px);text-align:center;text-wrap:balance}
.prato{--tam:150px;position:relative;isolation:isolate;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;flex:0 1 auto;min-height:0;
  gap:calc(var(--tam) * .05) calc(var(--tam) * .12);padding:calc(var(--tam) * .16) min(70px, 4.5vw) calc(var(--tam) * .3)}
.prato.rola{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.prato::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:22%;bottom:0;border-radius:50%;
  background:radial-gradient(ellipse 60% 55% at 50% 42%, #2C7381 0%, #1C5966 52%, #124450 78%, #0C3540 100%);
  box-shadow:inset 0 0 0 10px rgba(255,255,255,.05), inset 0 -16px 34px rgba(0,0,0,.35), 0 34px 60px -26px rgba(0,0,0,.75)}
.bolinho{position:relative;width:var(--tam);aspect-ratio:240/170;padding:0;border:0;background:none;cursor:pointer;border-radius:44%;
  transform:translate(var(--dx),var(--dy)) rotate(var(--rot));animation:flutuar 3.4s ease-in-out var(--atraso) infinite}
.bolinho svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.bolinho:hover,.bolinho:focus-visible{animation:abanar .55s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,214,120,.65))}
.bolinho:focus-visible{outline-offset:8px;border-radius:36px}
.bolinho.aberto{visibility:hidden}
.bolinho.entrar{animation:entrar .75s cubic-bezier(.3,1.45,.5,1) calc(var(--i) * var(--passo, 70ms)) both, flutuar 3.4s ease-in-out calc(.8s + var(--atraso)) infinite}
@keyframes flutuar{0%,100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}50%{transform:translate(var(--dx),calc(var(--dy) - 7px)) rotate(calc(var(--rot) + 2deg))}}
@keyframes abanar{0%,100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.08)}25%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--rot) - 6deg)) scale(1.08)}75%{transform:translate(var(--dx),var(--dy)) rotate(calc(var(--rot) + 6deg)) scale(1.08)}}
@keyframes entrar{from{transform:translate(var(--dx),-160%) rotate(calc(var(--rot) - 40deg));opacity:0}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:1}}
/* Bolinho dourado: tem sempre uma surpresa lá dentro */
.bolinho.especial::after{content:"";position:absolute;right:2%;top:-8%;width:30%;aspect-ratio:1;pointer-events:none;
  background:radial-gradient(circle, #fff 0 18%, var(--brilho) 30%, transparent 62%);
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:cintilar 1.7s ease-in-out var(--atraso) infinite}
.bolinho.especial::before{content:"";position:absolute;left:4%;bottom:14%;width:18%;aspect-ratio:1;pointer-events:none;background:#fff;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:cintilar 2.3s ease-in-out calc(var(--atraso) - .8s) infinite}
@keyframes cintilar{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.contador{color:var(--texto-suave);font-size:14px;margin:0;font-variant-numeric:tabular-nums;text-align:center}
.dica-teclado{color:var(--texto-suave);font-size:13px;margin:0;opacity:.8;text-align:center}
@media (hover:none){.dica-teclado{display:none}}

.vazio-prato{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:46ch;padding:28px 20px;border-radius:24px;background:rgba(8,39,48,.6);box-shadow:inset 0 0 0 1px var(--noite-borda)}
.vazio-prato h2{font-family:var(--f-marca);font-weight:400;font-size:clamp(26px,3.4vw,38px);line-height:1.05;margin:0}
.vazio-prato p{margin:0;color:var(--texto-suave)}
.botoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- Abrir o bolinho ---------- */
.revelar{position:absolute;inset:0;z-index:5;display:grid;place-items:center;overflow:hidden}
.revelar-fundo{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%, rgba(8,39,48,.55), rgba(4,20,25,.88));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.revelar-conteudo{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.4vh,30px);width:100%;max-width:980px;padding-block:12px}
.cena{display:grid;grid-template-areas:"c";place-items:center;width:100%;perspective:900px}
.grande{grid-area:c;position:relative;width:min(58vw,330px);aspect-ratio:240/170}
.metade{position:absolute;inset:0;transform-origin:50% 61%}
.metade svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 16px 16px rgba(0,0,0,.42))}
.brilho-grande{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle, rgba(255,226,140,.55) 0%, rgba(255,200,100,.18) 40%, transparent 68%);opacity:0;pointer-events:none}
.papel{grid-area:c;position:relative;width:min(100%,820px);opacity:0;color:var(--tinta);text-align:center;
  padding:clamp(22px,3.6vw,40px) clamp(22px,4.6vw,56px) clamp(18px,2.6vw,26px);border-radius:3px;
  background:
    repeating-linear-gradient(90deg, rgba(120,90,50,.035) 0 2px, transparent 2px 7px),
    linear-gradient(180deg, #FFFBF2, var(--papel) 40%, #FBF0DB);
  box-shadow:0 28px 50px -20px rgba(0,0,0,.7), 0 3px 0 var(--papel-sombra)}
.papel::before,.papel::after{content:"";position:absolute;left:clamp(14px,2.6vw,26px);right:clamp(14px,2.6vw,26px);height:2px;background:repeating-linear-gradient(90deg, var(--coral-tinta) 0 10px, transparent 10px 16px);opacity:.55}
.papel::before{top:12px}
.papel::after{bottom:12px}
.papel-conteudo{transform-origin:50% 50%}
.papel-vez{margin:0 0 10px;font-weight:700;font-size:clamp(16px,1.8vw,20px);color:var(--coral-tinta)}
.papel-pergunta{font-family:var(--f-pergunta);font-weight:400;font-size:clamp(25px,3.7vw,48px);line-height:1.16;margin:0;text-wrap:balance;letter-spacing:-.005em}
.papel-sorte{display:flex;justify-content:center;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin:clamp(14px,2.4vw,22px) 0 0;font-size:14px;color:var(--tinta-suave);font-weight:600}
.papel-sorte b{font-family:var(--f-pergunta);font-weight:400;font-size:20px;color:var(--coral-tinta);font-variant-numeric:tabular-nums;min-width:2ch;display:inline-block}
.acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 26px;border-radius:999px;border:0;font-weight:700;font-size:17px;cursor:pointer;white-space:nowrap}
.btn .ic{width:22px;height:22px}
.btn-massa{background:var(--massa-clara);color:var(--tinta);box-shadow:0 6px 0 var(--massa-escura)}
.btn-massa:hover{background:#FAD991}
.btn-massa:active{transform:translateY(3px);box-shadow:0 3px 0 var(--massa-escura)}
.btn-linha{background:transparent;color:var(--texto);box-shadow:inset 0 0 0 2px var(--noite-borda)}
.btn-linha:hover{box-shadow:inset 0 0 0 2px var(--massa-clara)}
.btn-peq{height:44px;padding:0 18px;font-size:15px}

/* Surpresas */
.salto{grid-area:c;position:relative;width:min(46vw,250px);aspect-ratio:1;z-index:3;pointer-events:none;opacity:0}
.salto-desenho{width:100%;height:100%}
.salto-desenho svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45))}
.grito{position:absolute;left:50%;bottom:96%;translate:-50% 0;margin:0;white-space:nowrap;opacity:0;
  background:var(--papel);color:var(--tinta);font-family:var(--f-marca);font-size:clamp(20px,2.8vw,32px);line-height:1.1;padding:12px 20px;border-radius:22px;box-shadow:0 12px 24px -10px rgba(0,0,0,.5)}
.grito::after{content:"";position:absolute;left:50%;top:100%;translate:-50% -2px;border:12px solid transparent;border-top-color:var(--papel)}
.papel-surpresa{display:inline-block;margin:0 0 14px;padding:8px 18px;border-radius:999px;background:var(--coral-tinta);color:#fff;font-weight:600;font-size:clamp(15px,1.6vw,19px);line-height:1.35;max-width:100%;text-wrap:balance}
.papel-surpresa b{font-weight:800}
.papel-personagem{position:absolute;z-index:2;left:clamp(-64px,-4.4vw,-20px);top:clamp(-96px,-8vw,-56px);width:clamp(92px,11.5vw,148px);aspect-ratio:1;pointer-events:none}
.papel-personagem svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 85%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));animation:balancar 2.6s ease-in-out infinite}
@keyframes balancar{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

/* Temporizador */
.tempo{position:absolute;top:-30px;right:-14px;width:72px;height:72px;border:0;padding:0;background:var(--noite);border-radius:50%;cursor:pointer;box-shadow:0 8px 18px -6px rgba(0,0,0,.5);color:var(--texto)}
.tempo svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.tempo .anel-fundo{stroke:var(--noite-borda)}
.tempo .anel{stroke:var(--massa-clara);transition:stroke-dashoffset 1s linear}
.tempo-num{position:relative;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.tempo.pouco .anel{stroke:var(--coral)}
.tempo.fim{animation:pulsar .6s ease-in-out 4}
.tempo.pausa .tempo-num{opacity:.55}
@keyframes pulsar{50%{transform:scale(1.15)}}

/* ---------- Aviso ---------- */
#aviso{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,16px);z-index:20;max-width:calc(100% - 32px);
  background:var(--papel);color:var(--tinta);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
#aviso.ver{opacity:1;transform:translate(-50%,0)}

/* ---------- Painel das perguntas e definições ---------- */
.painel{margin:0 0 0 auto;padding:0;border:0;width:min(500px,100%);height:100%;max-height:100%;max-width:100%;
  background:var(--papel);color:var(--tinta);color-scheme:light;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.painel[open]{display:flex;flex-direction:column;animation:deslizar .28s cubic-bezier(.2,.8,.2,1)}
.painel::backdrop{background:rgba(4,18,22,.6)}
@keyframes deslizar{from{transform:translateX(40px);opacity:0}}
.painel-cab{display:flex;align-items:center;gap:8px;padding:14px max(16px, env(safe-area-inset-right, 0px)) 0 20px;padding-top:calc(14px + env(safe-area-inset-top, 0px));border-bottom:1px solid var(--papel-linha)}
.abas{display:flex;gap:4px;flex:1}
.abas button{border:0;background:none;padding:12px 12px 13px;font-weight:700;font-size:16px;color:var(--tinta-suave);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.abas button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--coral-tinta)}
.fechar{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--tinta);cursor:pointer;display:grid;place-items:center}
.fechar:hover{background:var(--papel-sombra)}
.painel-corpo{flex:1;overflow:auto;padding:20px max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px;display:flex;flex-direction:column;gap:18px}
.painel h2{font-family:var(--f-marca);font-weight:400;font-size:26px;line-height:1.1;margin:0}
.painel h3{font-size:15px;margin:0}
.ajuda{margin:0;color:var(--tinta-suave);font-size:14px}
.painel :focus-visible{outline-color:var(--coral-tinta)}
.conjuntos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.conj{border-radius:14px;background:#FFFDF8;box-shadow:inset 0 0 0 1px var(--papel-linha);padding:12px 14px}
.conj.ativo{box-shadow:inset 0 0 0 2px var(--coral-tinta);background:#FFF3EC}
.conj-linha{display:flex;align-items:center;gap:12px}
.conj-escolha{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.conj-escolha input{width:20px;height:20px;accent-color:var(--coral-tinta);flex:none;margin:0}
.conj-txt{display:flex;flex-direction:column;min-width:0}
.conj-nome{font-weight:700;line-height:1.3}
.conj-meta{font-size:13px;color:var(--tinta-suave)}
.conj-acoes{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.lig{border:0;background:none;padding:6px 8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--coral-tinta);cursor:pointer}
.lig:hover{background:var(--papel-sombra)}
.lig-perigo{color:#9E2A17}
.conj-lista{margin:10px 0 2px;padding-left:22px;font-size:14px;color:var(--tinta);display:flex;flex-direction:column;gap:4px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.campo legend{font-weight:700;font-size:15px}
.painel input[type="text"],.painel textarea,.painel select{font:inherit;font-size:16px;color:var(--tinta);background:#FFFDF8;border:1px solid var(--papel-linha);border-radius:10px;padding:10px 12px;width:100%}
.painel textarea{resize:vertical;line-height:1.45;min-height:120px}
.painel input[type="range"]{width:100%;accent-color:var(--coral-tinta)}
.linha-range{display:flex;align-items:center;gap:12px}
.linha-range output{min-width:2.5ch;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--coral-tinta);margin:0;flex:none}
.bp{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;border:0;font-weight:700;font-size:15px;cursor:pointer}
.bp-cheio{background:var(--tinta);color:var(--papel)}
.bp-cheio:hover{background:#3D3128}
.bp-linha{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1.5px var(--papel-linha)}
.bp-linha:hover{box-shadow:inset 0 0 0 1.5px var(--tinta)}
.bp-perigo{background:#9E2A17;color:#fff}
.bp-peq{height:38px;padding:0 14px;font-size:14px}
.botoes-painel{display:flex;gap:10px;flex-wrap:wrap}
.modelos{display:flex;flex-direction:column;gap:8px;border:0;margin:0;padding:0}
.modelo{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#FFFDF8;box-shadow:inset 0 0 0 1px var(--papel-linha);cursor:pointer}
.modelo:has(input:checked){box-shadow:inset 0 0 0 2px var(--coral-tinta);background:#FFF3EC}
.modelo input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--coral-tinta);flex:none}
.modelo b{display:block}
.modelo span{font-size:14px;color:var(--tinta-suave)}
.previa{margin:0;padding:14px 16px 14px 36px;border-radius:14px;background:#FFFDF8;box-shadow:inset 0 0 0 1px var(--papel-linha);display:flex;flex-direction:column;gap:6px;font-size:15px}
.erro{margin:0;color:#9E2A17;font-weight:700}
.separador{border:0;border-top:1px solid var(--papel-linha);margin:4px 0}

@media (max-width:640px){
  .topo{padding-block:10px}

/* Dentro da página do site (?embutido): o nome já está no título da página, por isso o topo fica só
   com os botões. Em ecrã inteiro o nome volta, porque aí a página do site deixa de se ver. */
.embutido:not(:fullscreen) .marca{display:none}
.embutido:not(:fullscreen) .topo{justify-content:flex-end}
/* Seta para voltar à página do site (só com ?site) */
.voltar{display:none}
.com-voltar .voltar{display:inline-flex;text-decoration:none}
.com-voltar .marca{margin-right:auto}

@media (prefers-reduced-motion: reduce){
  .bolinho,.bolinho:hover,.bolinho:focus-visible,.bolinho.entrar,.bolinho.especial::after,.bolinho.especial::before,.papel-personagem svg{animation:none}
  .painel[open]{animation:none}
  #aviso{transition:none}
}

<div class="app" id="app">

  <header class="topo">

   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHAVE = 'bolinho-da-sorte:v1';
const PADRAO = { ativos: ['apresentacao', 'quebra-gelo'], nBolinhos: 12, surpresas: 'algumas', naoRepetir: true, numerosSorte: true, tempo: 0,
  participantes: [], sortearPessoa: false, musica: true, efeitos: true, volume: 0.7 };
let cfg = { ...PADRAO }, proprios = [];
try {
  const g = JSON.parse(localStorage.getItem(CHAVE) || 'null');
  if (g && typeof g === 'object') {
    cfg = { ...PADRAO, ...(g.cfg || {}) };
    proprios = Array.isArray(g.proprios) ? g.proprios.filter(c => c && c.id && Array.isArray(c.perguntas)) : [];
  }
} catch (e) { /* sem memória: começa com os valores por defeito */ }
function gravar() { try { localStorage.setItem(CHAVE, JSON.stringify({ cfg, proprios })); } catch (e) { /* ignorar */ } }

function perguntasAtivas() {

}
const porSair = () => perguntasAtivas().filter(p => !cfg.naoRepetir || !usadas.has(p));
function sortearPergunta(excluir) {

function sortearPessoa() {
  const nomes = cfg.participantes.filter(Boolean);
  if (!cfg.sortearPessoa || !nomes.length) return null;
  let livres = nomes.filter(n => !jaRespondeu.has(n));
  if (!livres.length) { jaRespondeu.clear(); livres = nomes; }

function numerosSorte() {
  const s = new Set(); while (s.size < 3) s.add(1 + Math.floor(Math.random() * 49));

/* =========================================================

const Som = (() => {

      busMusica = ctx.createGain(); busMusica.connect(gMusica);

      const ecoFiltro = ctx.createBiquadFilter(); ecoFiltro.type = 'lowpass'; ecoFiltro.frequency.value = 2400;
      busMusica.connect(eco); eco.connect(ecoFiltro); ecoFiltro.connect(ecoFb); ecoFb.connect(eco); ecoFiltro.connect(gMusica);
      gEfeitos = ctx.createGain(); gEfeitos.gain.value = cfg.efeitos ? 0.9 : 0; gEfeitos.connect(mestre);
      ruido = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = ruido.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    g2.gain.setValueAtTime(0.0001, t); g2.gain.exponentialRampToValueAtTime(vol * 0.3, t + 0.004); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g); g.connect(destino); o2.connect(g2); g2.connect(destino);

(() => {

/* =========================================================

   ========================================================= */
function sortearSabor() {
  const lista = Object.entries(SABORES).filter(([, c]) => c.peso);
  let r = Math.random() * lista.reduce((a, [, c]) => a + c.peso, 0);
  for (const [v, c] of lista) { r -= c.peso; if (r <= 0) return v; }
  return 'classico';
}
function encherPrato() {
  const n = cfg.nBolinhos, quota = SURPRESAS[cfg.surpresas].dourados;
  const dourados = quota ? Math.max(1, Math.round(n * quota)) : 0;
  const quais = new Set();
  while (quais.size < Math.min(dourados, n)) quais.add(Math.floor(Math.random() * n));
  prato = Array.from({ length: n }, (_, i) => ({
    id: ++seq, rot: Math.round((Math.random() - 0.5) * 30), atraso: -(Math.random() * 3.4).toFixed(2),
    dx: Math.round((Math.random() - 0.5) * 10), dy: Math.round((Math.random() - 0.5) * 10),
    especial: quais.has(i), sabor: quais.has(i) ? 'dourado' : sortearSabor()
  }));
}
function desenharPrato(entrar = false) {
  const el = $('#prato'), passo = Math.min(70, Math.round(1500 / Math.max(1, prato.length)));
  el.innerHTML = prato.map((b, i) => `<button class="bolinho${b.especial ? ' especial' : ''}${entrar ? ' entrar' : ''}" type="button" data-id="${b.id}" style="--rot:${b.rot}deg;--atraso:${b.atraso}s;--dx:${b.dx}px;--dy:${b.dy}px;--i:${i};--passo:${passo}ms" aria-label="Abrir o bolinho ${i + 1}${b.especial ? ', dourado' : `, ${SABORES[b.sabor].nome}`}"><svg viewBox="0 0 240 170" aria-hidden="true"><use href="#bolinho-${b.sabor}"/></svg></button>`).join('');
  atualizarContador();
}
// Escolhe o tamanho dos bolinhos para caberem todos no ecrã (até 40)
function ajustarPrato() {
  const area = $('#prato-area'), el = $('#prato');
  if (el.hidden || !prato.length || !area.clientHeight) return;
  const visiveis = [...area.children].filter(c => !c.hidden && getComputedStyle(c).display !== 'none');
  const cs = getComputedStyle(area), gap = parseFloat(cs.rowGap) || 0;
  const outros = visiveis.filter(c => c !== el).reduce((a, c) => a + c.getBoundingClientRect().height, 0);
  const H = area.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - outros - gap * (visiveis.length - 1);
  const W = el.clientWidth - 2 * Math.min(70, innerWidth * 0.045);
  const n = prato.length, maximo = innerWidth < 640 ? 118 : 176, minimo = 46;
  let s = maximo, cabe = false;
  for (; s >= minimo; s -= 2) {
    const h = s * 170 / 240, gx = s * 0.12, gy = s * 0.05;

let correntes = [], saltar = false;

}

  estado = 'prato';
  const alvo = document.querySelectorAll('.bolinho')[Math.min(Math.max(indice, 0), prato.length - 1)];
  if (alvo && document.activeElement !== document.body) alvo.focus({ preventScroll: true });
}

function abrirAoCalhas() {
  const bs = [...document.querySelectorAll('.bolinho:not(.aberto)')];
  if (bs.length && !$('#prato').hidden) abrir(Number(bs[Math.floor(Math.random() * bs.length)].dataset.id));
}
function avancar() {
  if ($('#painel').open) return;
  if (estado === 'prato') abrirAoCalhas();
  else if (estado === 'revelado') proximo();
  else if (estado === 'a_abrir') { saltar = true; correntes.forEach(a => { try { a.finish(); } catch (e) { /* já acabou */ } }); }
}

/* Temporizador para responder */
let tTempo = null, restante = 0, emPausa = false, tempoTotal = 0;
const PERIMETRO = 2 * Math.PI * 31;
function iniciarTempo() {
  pararTempo();
  const el = $('#tempo');
  tempoTotal = (atual && atual.surpresa && atual.surpresa.tempo) || cfg.tempo;
  if (!tempoTotal) { el.hidden = true; return; }
  restante = tempoTotal; emPausa = false; el.hidden = false; el.classList.remove('fim', 'pouco', 'pausa');
  const anel = $('#anel'); anel.style.strokeDasharray = PERIMETRO; anel.style.transition = 'none'; anel.style.strokeDashoffset = 0;
  void anel.getBoundingClientRect(); anel.style.transition = '';
  desenharTempo();
  tTempo = setInterval(() => {
    if (emPausa) return;
    restante--;
    desenharTempo();
    if (restante <= 5 && restante > 0) Som.tique();
    if (restante <= 0) { pararTempo(); el.classList.add('fim'); Som.fimTempo(); aviso('Tempo!'); }
  }, 1000);
}
function desenharTempo() {
  const el = $('#tempo');
  $('#tempo-num').textContent = Math.max(0, restante);
  $('#anel').style.strokeDashoffset = PERIMETRO * (1 - Math.max(0, restante) / tempoTotal);
  el.classList.toggle('pouco', restante <= 10);
  el.setAttribute('aria-label', `${Math.max(0, restante)} segundos. Carrega para ${emPausa ? 'retomar' : 'pausar'}.`);
}
function pararTempo() { if (tTempo) { clearInterval(tTempo); tTempo = null; } }

/* =========================================================
   PAINEL: PERGUNTAS E DEFINIÇÕES
   ========================================================= */
const ui = { aba: 'perguntas', vista: 'lista', aberto: new Set(), editar: null, modelo: MODELOS[0].id, apagar: null };
const painel = $('#painel');
function abrirPainel(aba = 'perguntas') {
  ui.aba = aba; ui.vista = 'lista'; ui.apagar = null;
  desenharPainel();
  if (!painel.open) painel.showModal();
}
const contarLinhas = t => String(t).split('\n').map(x => x.trim()).filter(Boolean).length;
const pl = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

let vistaAnterior = '';
function desenharPainel() {
  document.querySelectorAll('#abas button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.aba === ui.aba)));
  const corpo = $('#painel-corpo'), vista = ui.aba + ':' + ui.vista;
  if (vista !== vistaAnterior) { corpo.scrollTop = 0; vistaAnterior = vista; }
  if (ui.aba === 'definicoes') corpo.innerHTML = vistaDefinicoes();
  else if (ui.vista === 'editar') corpo.innerHTML = vistaEditar();
  else if (ui.vista === 'modelo') corpo.innerHTML = vistaModelo();
  else corpo.innerHTML = vistaLista();
}
function vistaLista() {
  const item = c => {
    const ativo = cfg.ativos.includes(c.id), proprio = !CONJUNTOS_BASE.includes(c);
    const acoes = ui.apagar === c.id
      ? `<button class="lig lig-perigo" type="button" data-acao="confirmarApagar" data-id="${c.id}">Apagar mesmo</button><button class="lig" type="button" data-acao="naoApagar">Não</button>`
      : `<button class="lig" type="button" data-acao="ver" data-id="${c.id}" aria-expanded="${ui.aberto.has(c.id)}">${ui.aberto.has(c.id) ? 'Esconder' : 'Ver'}</button>
         <button class="lig" type="button" data-acao="editar" data-id="${c.id}">${proprio ? 'Editar' : 'Copiar e editar'}</button>
         ${proprio ? `<button class="lig lig-perigo" type="button" data-acao="apagar" data-id="${c.id}">Apagar</button>` : ''}`;
    return `<li class="conj${ativo ? ' ativo' : ''}">
      <div class="conj-linha">
        <label class="conj-escolha"><input type="checkbox" data-ativo="${c.id}" ${ativo ? 'checked' : ''}>
          <span class="conj-txt"><span class="conj-nome">${esc(c.nome)}</span><span class="conj-meta">${pl(c.perguntas.length, 'pergunta', 'perguntas')}${c.descricao ? `, ${esc(c.descricao).toLowerCase()}` : proprio ? ', criado por ti' : ''}</span></span></label>
        <div class="conj-acoes">${acoes}</div>
      </div>
      ${ui.aberto.has(c.id) ? `<ol class="conj-lista">${c.perguntas.map(p => `<li>${esc(p)}</li>`).join('')}</ol>` : ''}
    </li>`;
  };
  const total = perguntasAtivas().length;
  return `<h2 id="painel-titulo">Perguntas</h2>
    <p class="ajuda">Marca os conjuntos que entram no prato. ${total ? `Estão escolhidas ${pl(total, 'pergunta', 'perguntas')}.` : 'Ainda não há nenhum escolhido.'}</p>
    <div class="botoes-painel"><button class="bp bp-linha bp-peq" type="button" data-acao="todos">Marcar todos</button><button class="bp bp-linha bp-peq" type="button" data-acao="nenhum">Desmarcar todos</button></div>
    <ul class="conjuntos">${conjuntos().map(item).join('')}</ul>
    <div class="botoes-painel">
      <button class="bp bp-cheio" type="button" data-acao="novo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Novo conjunto</button>
      <button class="bp bp-linha" type="button" data-acao="modelo">Criar a partir de um modelo</button>
    </div>`;
}
function vistaEditar() {
  const c = ui.editar;
  return `<h2 id="painel-titulo">${c.id ? 'Editar conjunto' : 'Novo conjunto'}</h2>
    <div class="campo"><label for="ed-nome">Nome do conjunto</label><input type="text" id="ed-nome" value="${esc(c.nome)}" placeholder="ex.: Equipa de vendas" maxlength="60"></div>
    <div class="campo"><label for="ed-perguntas">Perguntas</label>
      <textarea id="ed-perguntas" rows="12" placeholder="Uma pergunta por linha">${esc(c.perguntas.join('\n'))}</textarea>
      <p class="ajuda">Uma pergunta por linha. Podes colar uma lista inteira. <span id="ed-contagem">${pl(contarLinhas(c.perguntas.join('\n')), 'pergunta', 'perguntas')}</span></p></div>
    <p class="erro" id="ed-erro" role="alert" hidden></p>
    <div class="botoes-painel"><button class="bp bp-cheio" type="button" data-acao="guardar">Guardar conjunto</button><button class="bp bp-linha" type="button" data-acao="voltar">Cancelar</button></div>`;
}
function perguntasModelo(m, tema) { return m.perguntas.map(p => p.replaceAll('{tema}', tema)); }
function vistaModelo() {
  const m = MODELOS.find(x => x.id === ui.modelo) || MODELOS[0];
  const valor = ui.modeloValor || '';
  const tema = valor.trim() || m.exemplo;
  return `<h2 id="painel-titulo">Criar a partir de um modelo</h2>
    <p class="ajuda">Escolhe um modelo e escreve o tema. As perguntas adaptam-se e depois podes editá-las.</p>
    <fieldset class="modelos"><legend class="sr-only">Modelo</legend>
      ${MODELOS.map(x => `<label class="modelo"><input type="radio" name="modelo" value="${x.id}" ${x.id === m.id ? 'checked' : ''}><span><b>${esc(x.nome)}</b><span>${esc(x.descricao)}</span></span></label>`).join('')}
    </fieldset>
    <div class="campo"><label for="mod-valor">${esc(m.campo)}</label><input type="text" id="mod-valor" value="${esc(valor)}" placeholder="ex.: ${esc(m.exemplo)}" maxlength="60"></div>
    <div class="campo"><h3 id="mod-previa-tit">Pré-visualização${valor.trim() ? '' : ' (com o exemplo)'}</h3>
      <ol class="previa" id="mod-previa">${perguntasModelo(m, tema).map(p => `<li>${esc(p)}</li>`).join('')}</ol></div>
    <p class="erro" id="mod-erro" role="alert" hidden></p>
    <div class="botoes-painel"><button class="bp bp-cheio" type="button" data-acao="criarModelo">Criar conjunto</button><button class="bp bp-linha" type="button" data-acao="voltar">Cancelar</button></div>`;
}
function vistaDefinicoes() {
  const tempos = [[0, 'Sem tempo'], [30, '30 segundos'], [60, '1 minuto'], [90, '1 minuto e meio'], [120, '2 minutos']];
  return `<h2 id="painel-titulo">Definições</h2>
    <div class="campo"><label for="d-n">Bolinhos no prato</label><div class="linha-range"><input type="range" id="d-n" min="3" max="${MAX_BOLINHOS}" step="1" value="${cfg.nBolinhos}" data-def="nBolinhos"><output id="d-n-v">${cfg.nBolinhos}</output></div>
      ${cfg.participantes.length ? `<div><button class="bp bp-linha" type="button" data-acao="porParticipante">Um bolinho por participante (${Math.min(MAX_BOLINHOS, cfg.participantes.length)})</button></div>` : '<p class="ajuda">Até 40. Com a lista de participantes preenchida, podes pôr um bolinho por pessoa.</p>'}</div>
    <div class="campo"><label for="d-surpresas">Surpresas portuguesas</label><select id="d-surpresas" data-def="surpresas">${[['nenhuma', 'Sem surpresas'], ['algumas', 'De vez em quando'], ['muitas', 'Muitas']].map(([v, t]) => `<option value="${v}" ${cfg.surpresas === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <p class="ajuda">Galo de Barcelos, sardinha, pastel de nata e outras personagens saltam de alguns bolinhos com um desafio. Os bolinhos dourados têm sempre surpresa.</p></div>
    <label class="chk"><input type="checkbox" data-def="naoRepetir" ${cfg.naoRepetir ? 'checked' : ''}> Não repetir perguntas na mesma ronda</label>
    <label class="chk"><input type="checkbox" data-def="numerosSorte" ${cfg.numerosSorte ? 'checked' : ''}> Mostrar números da sorte no papel</label>
    <div class="campo"><label for="d-tempo">Tempo para responder</label><select id="d-tempo" data-def="tempo">${tempos.map(([v, t]) => `<option value="${v}" ${cfg.tempo === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <hr class="separador">
    <div class="campo"><label for="d-part">Participantes</label><textarea id="d-part" rows="5" placeholder="Um nome por linha" data-def="participantes">${esc(cfg.participantes.join('\n'))}</textarea>
      <p class="ajuda">Opcional. Com nomes, o papel diz quem responde e ninguém repete até todos terem respondido.</p></div>
    <label class="chk"><input type="checkbox" data-def="sortearPessoa" ${cfg.sortearPessoa ? 'checked' : ''}> Sortear quem responde</label>
    <hr class="separador">
    <h3>Som</h3>
    <label class="chk"><input type="checkbox" data-def="musica" ${cfg.musica ? 'checked' : ''}> Música de fundo</label>
    <label class="chk"><input type="checkbox" data-def="efeitos" ${cfg.efeitos ? 'checked' : ''}> Efeitos sonoros</label>
    <div class="campo"><label for="d-vol">Volume</label><div class="linha-range"><input type="range" id="d-vol" min="0" max="1" step="0.05" value="${cfg.volume}" data-def="volume"><output id="d-vol-v">${Math.round(cfg.volume * 100)}</output></div></div>
    <hr class="separador">
    <div class="botoes-painel"><button class="bp bp-cheio" type="button" data-acao="recomecar">Recomeçar a ronda</button></div>
    <p class="ajuda">Recomeçar põe todas as perguntas de volta e enche o prato. As tuas perguntas e definições ficam guardadas neste navegador.</p>`;
}

painel.addEventListener('click', e => {
  if (e.target === painel) { painel.close(); return; }
  const b = e.target.closest('[data-acao]');
  if (!b) return;
  const id = b.dataset.id, a = b.dataset.acao;
  if (a === 'ver') { ui.aberto.has(id) ? ui.aberto.delete(id) : ui.aberto.add(id); desenharPainel(); }
  else if (a === 'novo') { ui.editar = { id: null, nome: '', perguntas: [] }; ui.vista = 'editar'; desenharPainel(); $('#ed-nome').focus(); }
  else if (a === 'editar') {
    const c = conj(id), proprio = !CONJUNTOS_BASE.includes(c);
    ui.editar = proprio ? { id: c.id, nome: c.nome, perguntas: [...c.perguntas] } : { id: null, nome: `${c.nome} (a minha versão)`, perguntas: [...c.perguntas], substitui: c.id };
    ui.vista = 'editar'; desenharPainel(); $('#ed-perguntas').focus();
  }
  else if (a === 'apagar') { ui.apagar = id; desenharPainel(); painel.querySelector('[data-acao="confirmarApagar"]').focus(); }
  else if (a === 'naoApagar') { ui.apagar = null; desenharPainel(); }
  else if (a === 'confirmarApagar') {
    const c = conj(id); proprios = proprios.filter(x => x.id !== id); cfg.ativos = cfg.ativos.filter(x => x !== id);
    ui.apagar = null; gravar(); desenharPainel(); atualizarContador(); aviso(`Conjunto «${c.nome}» apagado.`);
  }
  else if (a === 'voltar') { ui.vista = 'lista'; desenharPainel(); }
  else if (a === 'modelo') { ui.vista = 'modelo'; ui.modeloValor = ''; desenharPainel(); $('#mod-valor').focus(); }
  else if (a === 'guardar') guardarConjunto();
  else if (a === 'criarModelo') criarDeModelo();
  else if (a === 'recomecar') recomecar();
  else if (a === 'todos' || a === 'nenhum') {
    cfg.ativos = a === 'todos' ? conjuntos().map(c => c.id) : [];
    gravar(); desenharPainel(); atualizarContador();
    aviso(a === 'todos' ? `Todos os conjuntos no prato: ${perguntasAtivas().length} perguntas.` : 'Nenhum conjunto escolhido.');
  }
  else if (a === 'porParticipante') {
    cfg.nBolinhos = Math.min(MAX_BOLINHOS, Math.max(3, cfg.participantes.length)); gravar();
    if (estado === 'prato') { encherPrato(); desenharPrato(true); }
    desenharPainel(); aviso(`Prato com ${cfg.nBolinhos} bolinhos, um por participante.`);
  }
});
painel.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ativo) {
    const id = t.dataset.ativo;
    cfg.ativos = t.checked ? [...new Set([...cfg.ativos, id])] : cfg.ativos.filter(x => x !== id);
    gravar(); desenharPainel(); atualizarContador();
    painel.querySelector(`[data-ativo="${CSS.escape(id)}"]`)?.focus();
  }
  if (t.name === 'modelo') { ui.modelo = t.value; ui.modeloValor = $('#mod-valor').value; desenharPainel(); painel.querySelector(`input[value="${t.value}"]`).focus(); }
  if (t.dataset.def) mudarDefinicao(t);
});
painel.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ed-perguntas') $('#ed-contagem').textContent = pl(contarLinhas(t.value), 'pergunta', 'perguntas');
  if (t.id === 'mod-valor') {
    ui.modeloValor = t.value;
    const m = MODELOS.find(x => x.id === ui.modelo);
    $('#mod-previa').innerHTML = perguntasModelo(m, t.value.trim() || m.exemplo).map(p => `<li>${esc(p)}</li>`).join('');
    $('#mod-previa-tit').textContent = 'Pré-visualização' + (t.value.trim() ? '' : ' (com o exemplo)');
  }
  if (t.type === 'range' && t.dataset.def) { const o = $(`#${t.id}-v`); if (o) o.textContent = t.dataset.def === 'volume' ? Math.round(t.value * 100) : t.value; if (t.dataset.def === 'volume') { cfg.volume = Number(t.value); Som.volume(cfg.volume); } }
});
$('#abas').addEventListener('click', e => { const b = e.target.closest('[data-aba]'); if (b) { ui.aba = b.dataset.aba; ui.vista = 'lista'; desenharPainel(); b.focus(); } });
$('#fechar-painel').addEventListener('click', () => painel.close());
painel.addEventListener('close', () => { if (estado === 'prato') atualizarContador(); });

function guardarConjunto() {
  const nome = $('#ed-nome').value.trim() || 'As minhas perguntas';
  const perguntas = $('#ed-perguntas').value.split('\n').map(x => x.trim()).filter(Boolean);
  const erro = $('#ed-erro');
  if (!perguntas.length) { erro.textContent = 'Escreve pelo menos uma pergunta.'; erro.hidden = false; $('#ed-perguntas').focus(); return; }
  const e = ui.editar;
  if (e.id) { const c = proprios.find(x => x.id === e.id); c.nome = nome; c.perguntas = perguntas; }
  else {
    const novo = { id: 'p_' + Date.now().toString(36), nome, perguntas };
    proprios.push(novo);
    cfg.ativos = [...cfg.ativos.filter(x => x !== e.substitui), novo.id];
  }
  gravar(); ui.vista = 'lista'; desenharPainel(); atualizarContador();
  aviso(`Conjunto «${nome}» guardado${e.id ? '' : ' e escolhido para o prato'}.`);
}
function criarDeModelo() {
  const m = MODELOS.find(x => x.id === ui.modelo), tema = $('#mod-valor').value.trim();
  if (!tema) { const er = $('#mod-erro'); er.textContent = `Escreve ${m.campo.toLowerCase() === 'tema' ? 'o tema' : 'o nome da formação'} para criar o conjunto.`; er.hidden = false; $('#mod-valor').focus(); return; }
  const novo = { id: 'p_' + Date.now().toString(36), nome: m.nomeConjunto.replace('{tema}', tema), perguntas: perguntasModelo(m, tema) };
  proprios.push(novo); cfg.ativos = [...new Set([...cfg.ativos, novo.id])];
  gravar(); ui.vista = 'lista'; desenharPainel(); atualizarContador();
  aviso(`Conjunto «${novo.nome}» criado e escolhido para o prato.`);
}
function mudarDefinicao(t) {
  const k = t.dataset.def;
  if (k === 'nBolinhos') { cfg.nBolinhos = Number(t.value); if (estado === 'prato') { encherPrato(); desenharPrato(true); } }
  else if (k === 'surpresas') { cfg.surpresas = t.value; if (estado === 'prato') { encherPrato(); desenharPrato(true); } }
  else if (k === 'tempo') cfg.tempo = Number(t.value);
  else if (k === 'participantes') { cfg.participantes = t.value.split('\n').map(x => x.trim()).filter(Boolean); jaRespondeu.clear(); gravar(); desenharPainel(); }
  else if (k === 'volume') { cfg.volume = Number(t.value); Som.volume(cfg.volume); }
  else if (k === 'musica') { cfg.musica = t.checked; atualizarBotaoMusica(); if (cfg.musica) { Som.iniciar(); Som.tocarMusica(); } else Som.pararMusica(); }
  else if (k === 'efeitos') { cfg.efeitos = t.checked; Som.efeitos(cfg.efeitos); }
  else cfg[k] = t.checked;
  gravar(); atualizarContador();
}
function recomecar() {
  usadas.clear(); jaRespondeu.clear();
  if (estado === 'prato') { encherPrato(); desenharPrato(true); Som.encher(prato.length); }
  if (painel.open) painel.close();
  aviso('Ronda recomeçada: todas as perguntas voltaram ao prato.');
}

/* =========================================================
   TOPO, TECLADO E ARRANQUE
   ========================================================= */
let tAviso;
function aviso(msg) { const el = $('#aviso'); el.textContent = msg; el.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => el.classList.remove('ver'), 2800); }
function atualizarBotaoMusica() {
  const b = $('#btn-musica'); b.setAttribute('aria-pressed', String(cfg.musica));
  b.querySelector('.corte').hidden = cfg.musica;
  b.title = cfg.musica ? 'Desligar a música' : 'Ligar a música';
}
$('#btn-musica').addEventListener('click', () => {
  cfg.musica = !cfg.musica; gravar(); atualizarBotaoMusica();
  if (cfg.musica) { Som.iniciar(); Som.tocarMusica(); } else Som.pararMusica();
  aviso(cfg.musica ? 'Música ligada' : 'Música desligada');
});
$('#btn-perguntas').addEventListener('click', () => abrirPainel('perguntas'));
$('#btn-definicoes').addEventListener('click', () => abrirPainel('definicoes'));
const btnEcra = $('#btn-ecra');
if (!document.fullscreenEnabled) btnEcra.hidden = true;
btnEcra.addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => aviso('Este navegador não deixa pôr em ecrã inteiro aqui.'));
});
document.addEventListener('fullscreenchange', () => btnEcra.setAttribute('aria-label', document.fullscreenElement ? 'Sair do ecrã inteiro' : 'Ecrã inteiro'));

$('#prato').addEventListener('click', e => { const b = e.target.closest('.bolinho'); if (b) abrir(Number(b.dataset.id)); });
$('#vazio').addEventListener('click', e => {
  const b = e.target.closest('[data-acao]'); if (!b) return;
  if (b.dataset.acao === 'abrirPerguntas') abrirPainel('perguntas'); else recomecar();
});
$('#btn-proximo').addEventListener('click', proximo);
$('#btn-trocar').addEventListener('click', trocar);
$('#revelar-fundo').addEventListener('click', () => { if (estado === 'a_abrir') avancar(); });
$('#tempo').addEventListener('click', () => {
  if (!tTempo && restante <= 0) { iniciarTempo(); return; }
  emPausa = !emPausa; $('#tempo').classList.toggle('pausa', emPausa); desenharTempo();
});
document.addEventListener('keydown', e => {
  if (painel.open || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = e.target, escrever = t.closest && t.closest('input, textarea, select');
  if (escrever) return;
  const k = e.key;
  // comandos de apresentação enviam PageDown/PageUp ou setas
  if (k === 'PageDown' || k === 'ArrowRight' || (k === ' ' && !(t.closest && t.closest('button')))) { e.preventDefault(); avancar(); }
  else if ((k === 'PageUp' || k === 'ArrowLeft') && estado === 'revelado') { e.preventDefault(); trocar(); }
  else if (k === 'Escape' && estado === 'revelado') proximo();
  else if (k.toLowerCase() === 'm') $('#btn-musica').click();
  else if (k.toLowerCase() === 'f' && !btnEcra.hidden) btnEcra.click();
});
// O som só pode começar depois do primeiro toque ou tecla
const primeiroToque = () => { Som.iniciar(); removeEventListener('pointerdown', primeiroToque, true); removeEventListener('keydown', primeiroToque, true); };
addEventListener('pointerdown', primeiroToque, true);
addEventListener('keydown', primeiroToque, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) Som.suspender(); else Som.retomar(); });

atualizarBotaoMusica();
encherPrato();
desenharPrato(true);
</script>
</body>
</html>
