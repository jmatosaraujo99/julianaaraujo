  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loadingText = document.getElementById('__bundler_loading_text');
  const loadingFill = document.getElementById('__bundler_loading_fill');
  function setStatus(msg) { if (loadingText) loadingText.textContent = msg; }
  function setProgress(pct) { if (loadingFill) loadingFill.style.width = pct + '%'; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    const totalWeight = uuids.reduce(function(sum, u) { return sum + (manifest[u].data ? manifest[u].data.length : 0); }, 0) || 1;
    let doneWeight = 0;
    function bump(uuid) {
      doneWeight += (manifest[uuid].data ? manifest[uuid].data.length : 0);
      const pct = Math.min(100, Math.round((doneWeight / totalWeight) * 100));
      setStatus('A carregar\u2026 ' + pct + '%');
      setProgress(pct);
    }
    setStatus('A carregar\u2026 0%');
    setProgress(0);

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      } finally {
        bump(uuid);
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('A preparar\u2026');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const loadingWrap = document.getElementById('__bundler_loading');
    if (loadingWrap) loadingWrap.style.opacity = '0';
    await new Promise(function(r) { setTimeout(r, 120); });

    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

r\nbody{margin:0;background:#0A0A0A;color:#F2EFEA;font-family:Archivo,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}\r\na{color:#F2EFEA;text-decoration:none}\r\na:hover{color:#D9D2C5}\r\ninput,textarea,select,button{font:inherit;color:inherit}\r\ninput::placeholder,textarea::placeholder{color:rgba(242,239,234,0.34)}\r\n:focus-visible{outline:2px solid #D9D2C5;outline-offset:4px}\r\n::selection{background:#1F2ED6;color:#F2EFEA}\r\n@keyframes ja-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}\r\n@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}\r\n<\u002Fstyle>\r\n<style>\r\n@media (max-width:640px){\r\n  .hide-mobile{display:none !important}\r\n  /* Três pilares: duas colunas em vez de uma pilha alta; o terceiro ocupa a linha toda */\r\n  .ja-pilares{grid-template-columns:1fr 1fr !important;gap:26px 14px !important}\r\n  .ja-pilares>*:last-child{grid-column:1 / -1}\r\n  /* Oferta formativa: em telemóvel o número do bloco sobe e o código fica sobre a designação */\r\n  .ja-oferta-bloco{grid-template-columns:1fr !important;gap:14px !important}\r\n  .ja-oferta-linha{grid-template-columns:1fr !important;gap:4px !important}\r\n  .ja-oferta-cab{display:none !important}\r\n}\r\n\r\n/* Painéis do acordeão de Formações. O conteúdo fica sempre no HTML — para os\r\n   motores de busca o indexarem — e é o CSS que o mostra ou esconde. O\r\n   allow-discrete permite animar a passagem de display:none a block; onde não\r\n   houver suporte, o painel apenas aparece de imediato. */\r\n.ja-painel-wrap{display:none;opacity:0;transform:translateY(-8px);transition:opacity .42s cubic-bezier(.2,.7,.2,1),transform .42s cubic-bezier(.2,.7,.2,1),display .42s allow-discrete}\r\n.ja-painel-wrap[data-aberto=\"true\"]{display:block;opacity:1;transform:none}\r\n@starting-style{.ja-painel-wrap[data-aberto=\"true\"]{opacity:0;transform:translateY(-8px)}}\r\n/* a grelha de detalhes entra ligeiramente depois das etiquetas */\r\n.ja-painel-tardio{opacity:0;transform:translateY(-6px);transition:opacity .4s ease .09s,transform .4s ease .09s}\r\n.ja-painel-wrap[data-aberto=\"true\"] .ja-painel-tardio{opacity:1;transform:none}\r\n\r\n/* Cabeçalho compacta-se e ganha contraste assim que se começa a fazer scroll */\r\nheader{transition:background-color .35s ease,padding .35s ease,box-shadow .35s ease}\r\nhtml[data-scrolled] header{background:rgba(10,10,10,0.88) !important;padding-top:11px !important;padding-bottom:11px !important;box-shadow:0 1px 26px rgba(0,0,0,0.45)}\r\n\r\n/* Resposta tátil ao clique nos botões e ligações de ação */\r\nbutton:active,a:active{transform:scale(0.985)}\r\nbutton,a{transition-property:background-color,color,border-color,opacity,transform,padding-left;transition-duration:.25s;transition-timing-function:ease}\r\n\r\n/* Etiquetas de subtemas reagem ao rato */\r\n.ja-painel span{transition:border-color .25s ease,background-color .25s ease}\r\n.ja-painel span:hover{border-color:rgba(10,10,10,0.6);background-color:rgba(10,10,10,0.04)}\r\n\r\n/* A faixa de tags pausa quando o visitante quer ler */\r\n[style*=\"ja-marquee\"]:hover{animation-play-state:paused}\r\n<\u002Fstyle>\r\n<\u002Fhelmet>\r\n\r\n<div style=\"background:#0A0A0A;overflow-x:hidden\">\r\n\r\n<div aria-hidden=\"true\" style=\"position:fixed;top:0;left:0;right:0;z-index:70;height:2px;background:rgba(242,239,234,0.1)\">\r\n  <div ref=\"{{ barraRef }}\" style=\"width:0%;height:100%;background:#1F2ED6\"><\u002Fdiv>\r\n<\u002Fdiv>\r\n\r\n<sc-if value=\"{{ mostrarSecao }}\" hint-placeholder-val=\"{{ false }}\">\r\n<div aria-hidden=\"true\" style=\"position:fixed;left:clamp(18px,4vw,48px);bottom:clamp(18px,3vw,36px);z-index:45;display:flex;align-items:center;gap:10px;padding:11px 16px;background:rgba(10,10,10,0.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(242,239,234,0.18);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:500;letter-spacing:0.2em;t font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#8C877F\">@julianaaraujo.pt<\u002Fp>\r\n      <\u002Fdiv>\r\n      <nav style=\"display:flex;flex-direction:column;gap:10px;font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase\">\r\n        <a href=\"#sobre\">{{ navSobre }}<\u002Fa>\r\n        <a href=\"#formacoes\">{{ navFormacoes }}<\u002Fa>\r\n        <a href=\"#metodologia\">{{ navMetodologia }}<\u002Fa>\r\n      <\u002Fnav>\r\n      <nav style=\"display:flex;flex-direction:column;gap:10px;font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase\">\r\n        <a href=\"#recursos\">{{ navRecursos }}<\u002Fa>\r\n        <a href=\"#portefolio\">{{ navPortefolio }}<\u002Fa>\r\n        <a href=\"#contactos\">{{ navContactos }}<\u002Fa>\r\n      <\u002Fnav>\r\n      <p style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;line-height:2;color:#8C877F\">{{ taglineProf }}<br>{{ footerPresencialOnline }}<br>© 2026<\u002Fp>\r\n        <a href=\"privacidade.html\" style=\"display:inline-block;margin-top:10px;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8C877F;text-decoration:underline\">{{ politicaPrivacidadeLabel }}<\u002Fa>\r\n        <a href=\"recursos.html\" style=\"display:inline-block;margin-top:10px;margin-left:18px;font-family:'Space Grotesk',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8C877F;text-decoration:underline\">{{ verRecursosLabel }}<\u002Fa>\r\n    <\u002Fdiv>\r\n  <\u002Fdiv>\r\n<\u002Ffooter>\r\n\r\n<\u002Fdiv>\r\n\r\n<\u002Fx-dc>\r\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;fundoInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;video&quot;,&quot;retrato&quot;,&quot;liso&quot;],&quot;default&quot;:&quot;video&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Página inicial&quot;},&quot;mostrarPortefolio&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Secções&quot;}}\">\r\nconst TEXTOS = {\r\n  verRecursosBotao: { pt: \"Ver recursos\", en: \"See resources\" },\r\n  verRecursosLabel: { pt: \"Ver recursos →\", en: \"See resources →\" },\r\n  galeriaEyebrow: { pt: \"Em ação\", en: \"In action\" },\r\n  galeriaTitulo: { pt: \"Momentos reais de formação.\", en: \"Real training moments.\" },\r\n  altGaleria1: { pt: \"Participantes numa dinâmica de grupo ao ar livre durante uma formação de teambuilding\", en: \"Participants in an outdoor group activity during a team building session\" },\r\n  altGaleria2: { pt: \"Grupo de participantes de braços no ar no final de uma sessão de formação ao ar livre\", en: \"Group of participants with raised arms at the end of an outdoor training session\" },\r\n  altGaleria3: { pt: \"Participante a registar ideias numa ficha de reflexão com ícones desenhados à mão\", en: \"Participant noting ideas on a reflection worksheet with hand-drawn icons\" },\r\n  altGaleria4: { pt: \"Mãos a preencher uma ficha de reflexão com notas manuscritas durante uma formação\", en: \"Hands filling in a reflection worksheet with handwritten notes during a course\" },\r\n  altGaleria5: { pt: \"Material de formação sobre inteligência emocional, negociação e gestão de conflitos\", en: \"Training material on emotional intelligence, negotiation and conflict management\" },\r\n  altGaleria6: { pt: \"Profissionais de saúde a rir durante uma sessão de formação em equipa\", en: \"Healthcare professionals laughing during a team training session\" },\r\n  altGaleria7: { pt: \"Dados coloridos usados como material de dinamização numa sessão de formação\", en: \"Coloured dice used as facilitation material in a training session\" },\r\n  altGaleria8: { pt: \"Equipa de profissionais de saúde no final de uma formação em contexto organizacional\", en: \"Team of healthcare professionals at the end of an in-house training course\" },\r\n  navCatalogo: { pt: \"Oferta formativa\", en: \"Training offer\" },\r\n  falarComigo: { pt: \"Falar comigo\", en: \"Get in touch\" },\r\n  abrirMenuLabel: { pt: \"Abrir menu\", en: \"Open menu\" },\r\n  fecharMenuLabel: { pt: \"Fechar menu\", en: \"Close menu\" },\r\n  fecharBtn: { pt: \"Fechar\", en: \"Close\" },\r\n  navSobre: { pt: \"Sobre mim\", en: \"About me\" },\r\n  navFormacoes: { pt: \"Formações\", en: \"Courses\" },\r\n  navMetodologia: { pt: \"Metodologia\", en: \"Methodology\" },\r\n  navRecursos: { pt: \"Recursos\", en: \"Resources\" },\r\n  navPortefolio: { pt: \"Portefólio\", en: \"Portfolio\" },\r\n  navContactos: { pt: \"Contactos\", en: \"Contact\" },\r\n  taglineProf: { pt: \"Formadora certificada · Learning Designer · Formação para empresas\", en: \"Certified trainer · Learning Designer · Corporate training\" },\r\n  heroTitulo: { pt: \"Formação que impulsiona pessoas, equipas e organizações.\", en: \"Training that drives people, teams and organisations forward.\" },\r\n  heroSubtitulo: { pt: \"Formação comportamental à medida para empresas: experiências onde as pessoas participam, experimentam e aplicam o que aprendem.\", en: \"Tailor-made soft skills training for companies: experiences where people take part, experiment, and apply what they learn.\" },\r\n  heroVerFormacoes: { pt: \"Ver as formações\", en: \"View the courses\" },\r\n  heroPresencial: { pt: \"Barcelos · Presencial e online em todo o país\", en: \"Barcelos · In person and online across Portugal\" },\r\n  aberturaTitulo: { pt: \"Aprender é experimentar, refletir e aplicar\", en: \"Learning means experimenting, reflecting and applying\" },\r\n  aberturaTexto: { pt: \"Cada sessão é desenhada para colocar os participantes no centro da aprendizagem. Em vez de apenas ouvir, analisam situações, resolvem desafios, colaboram e testam novas abordagens. O resultado são competências que fazem sentido e podem ser aplicadas no contexto real.\", en: \"Each session is designed to put participants at the centre of their own learning. Instead of just listening, they analyse situations, solve challenges, collaborate and test new approaches. The result: skills that make sense and can be applied in real-world contexts.\" },\r\n  pilaresEyebrow: { pt: \"Três pilares\", en: \"Three pillars\" },\r\n  pilar1Titulo: { pt: \"Experimentar\", en: \"Experiment\" },\r\n  pilar1Texto: { pt: \"A sessão começa com um desafio, um caso ou uma decisão para tomar em grupo.\", en: \"The session starts with a challenge, a case, or a decision to make as a group.\" },\r\n  pilar2Titulo: { pt: \"Analisar\", en: \"Analyse\" },\r\n  pilar2Texto: { pt: \"O que aconteceu na atividade é analisado e conceptualizado. É aqui que o conteúdo ganha significado.\", en: \"What happened during the activity is analysed and conceptualised. This is where the content gains meaning.\" },\r\n  pilar3Titulo: { pt: \"Aplicar\", en: \"Apply\" },\r\n  pilar3Texto: { pt: \"Cada participante define como transferir o que trabalhou para o seu contexto profissional.\", en: \"Each participant defines how to transfer what they worked on to their own professional context.\" },\r\n  tagComunicacao: { pt: \"Comunicação\", en: \"Communication\" },\r\n  tagTrabalhoEquipa: { pt: \"Trabalho em equipa\", en: \"Teamwork\" },\r\n  tagLideranca: { pt: \"Liderança\", en: \"Leadership\" },\r\n  tagGestaoConflitos: { pt: \"Gestão de conflitos\", en: \"Conflict management\" },\r\n  tagDesenvolvimentoPessoal: { pt: \"Desenvolvimento pessoal\", en: \"Personal development\" },\r\n  tagCriatividade: { pt: \"Criatividade\", en: \"Creativity\" },\r\n  tagIA: { pt: \"Inteligência Artificial\", en: \"Artificial Intelligence\" },\r\n  tagCompetenciasTransversais: { pt: \"Competências transversais\", en: \"Transversal skills\" },\r\n  tagEducacao: { pt: \"Educação\", en: \"Education\" },\r\n  sobreEyebrow: { pt: \"Sobre mim\", en: \"About me\" },\r\n  sobreLegenda: { pt: \"Juliana Araújo — Formadora certificada · Ciências da Educação · Learning Design\", en: \"Juliana Araújo — Certified trainer · Education Sciences · Learning Design\" },\r\n  canaisEyebrow: { pt: \"Onde me encontra\", en: \"Where to find me\" },\r\n  linkWhatsapp: { pt: \"https://api.whatsapp.com/send/?phone=351961955373&text=Ol%C3%A1+Juliana%2C+gostaria+de+saber+mais+sobre+as+suas+forma%C3%A7%C3%B5es&type=phone_number&app_absent=0\", en: \"https://api.whatsapp.com/send/?phone=351961955373&text=Hello+Juliana%2C+I%27d+like+to+know+more+about+your+training+courses&type=phone_number&app_absent=0\" },\r\n  sobreTitulo: { pt: \"Cada formação começa muito antes do primeiro dia.\", en: \"Every course begins long before day one.\" },\r\n  sobreP1: { pt: \"Sou formadora certificada, licenciada e mestre em Ciências da Educação e Learning Designer. Trabalho diariamente com empresas, entidades formadoras, instituições de ensino superior e organizações do setor social — a conceber experiências de aprendizagem e a prestar consultoria em desenho formativo, sempre adaptadas aos desafios de cada contexto.\", en: \"I'm a certified trainer, with a degree and master's in Education Sciences, and a Learning Designer. I work daily with companies, training providers, higher education institutions and social-sector organisations — designing learning experiences and providing consultancy on instructional design, always tailored to each context's challenges.\" },\r\n  sobreP2: { pt: \"Acredito que uma boa formação não se constrói apenas com conteúdos. Constrói-se ao conhecer as pessoas, compreender as suas necessidades e criar experiências que façam sentido para quem participa.\", en: \"I believe good training isn't built with content alone. It's built by getting to know people, understanding their needs, and creating experiences that make sense for those taking part.\" },\r\n  sobreP3: { pt: \"Por isso, antes de cada sessão, procuro perceber quem é o grupo, quais são os seus desafios e onde a formação pode gerar maior impacto. A partir daí desenho atividades, materiais e dinâmicas que promovem participação, reflexão e aplicação prática. É também por isso que dificilmente duas formações são iguais: cada grupo traz novas experiências, necessidades e perspetivas.\", en: \"That's why, before every session, I try to understand who the group is, what their challenges are, and where the training can have the greatest impact. From there, I design activities, materials and dynamics that promote participation, reflection and practical application. It's also why hardly any two courses are ever the same: each group brings new experiences, needs and perspectives.\" },\r\n  sobreCitacao: { pt: \"O meu objetivo é criar espaços onde as pessoas se sintam envolvidas, participem ativamente e terminem a formação com competências que consigam aplicar no seu contexto profissional.\", en: \"My goal is to create spaces where people feel engaged, take an active part, and finish the course with skills they can actually apply in their own professional context.\" },\r\n  formacoesEyebrow: { pt: \"Oferta formativa\", en: \"Training offer\" },\r\n  formacoesTitulo: { pt: \"Oferta Formativa\", en: \"Training Offer\" },\r\n  formacoesTexto: { pt: \"Unidades de formação organizadas em quatro áreas, com o respetivo código. Podem ser realizadas de forma independente ou integradas num percurso formativo à medida da organização.\", en: \"Training units organised into four areas, each with its reference code. They can be delivered independently or combined into a training path tailored to the organisation.\" },\r\n  cat1Titulo: { pt: \"Comunicação e Relações Interpessoais\", en: \"Communication and Interpersonal Relations\" },\r\n  cat1Tag1: { pt: \"Comunicação eficaz\", en: \"Effective communication\" },\r\n  cat1Tag2: { pt: \"Comunicação em contexto profissional\", en: \"Communication in a professional context\" },\r\n  cat1Tag3: { pt: \"Escuta ativa\", en: \"Active listening\" },\r\n  cat1Tag4: { pt: \"Feedback\", en: \"Feedback\" },\r\n  cat1Tag6: { pt: \"Comunicação intercultural\", en: \"Intercultural communication\" },\r\n  cat1Objetivo: { pt: \"Dizer o que precisa de ser dito com clareza, ouvir com atenção verdadeira e atravessar conversas difíceis mantendo a relação de pé.\", en: \"Saying what needs to be said clearly, listening with real attention, and getting through difficult conversations while keeping the relationship intact.\" },\r\n  cat1QuemParticipa: { pt: \"Equipas, chefias de proximidade e quem trabalha em contacto direto com público ou clientes.\", en: \"Teams, frontline managers, and anyone who works in direct contact with the public or clients.\" },\r\n  cat1Competencias: { pt: \"Escuta ativa · Assertividade · Feedback · Mediação de conflitos · Comunicação intercultural\", en: \"Active listening · Assertiveness · Feedback · Conflict mediation · Intercultural communication\" },\r\n  cat2Titulo: { pt: \"Desenvolvimento Pessoal e Criatividade\", en: \"Personal Development and Creativity\" },\r\n  cat2Tag1: { pt: \"Gestão do tempo\", en: \"Time management\" },\r\n  cat2Tag2: { pt: \"Inteligência emocional\", en: \"Emotional intelligence\" },\r\n  cat2Tag3: { pt: \"Adaptabilidade\", en: \"Adaptability\" },\r\n  cat2Tag4: { pt: \"Autoconhecimento\", en: \"Self-awareness\" },\r\n  cat2Tag5: { pt: \"Gestão de stress\", en: \"Stress management\" },\r\n  cat2Tag6: { pt: \"Criatividade e resolução de problemas\", en: \"Creativity and problem-solving\" },\r\n  cat2Objetivo: { pt: \"Ganhar clareza sobre os próprios recursos e lidar com o tempo, as emoções e a pressão com mais consciência.\", en: \"Gaining clarity about your own resources and handling time, emotions and pressure with more awareness.\" },\r\n  cat2QuemParticipa: { pt: \"Profissionais em funções exigentes e equipas a atravessar processos de mudança.\", en: \"Professionals in demanding roles and teams going through periods of change.\" },\r\n  cat2Competencias: { pt: \"Autoconhecimento · Gestão emocional · Prioridades · Adaptabilidade · Criatividade\", en: \"Self-awareness · Emotional management · Prioritisation · Adaptability · Creativity\" },\r\n  cat3Titulo: { pt: \"Trabalho em Equipa e Liderança\", en: \"Teamwork and Leadership\" },\r\n  cat3Tag2: { pt: \"Cooperação\", en: \"Cooperation\" },\r\n  cat3Tag3: { pt: \"Liderança de equipas\", en: \"Team leadership\" },\r\n  cat3Tag4: { pt: \"Motivação\", en: \"Motivation\" },\r\n  cat3Tag5: { pt: \"Tomada de decisão\", en: \"Decision-making\" },\r\n  cat3Tag6: { pt: \"Teambuilding\", en: \"Team building\" },\r\n  cat3Objetivo: { pt: \"Construir confiança, decidir em conjunto e cooperar com um objetivo verdadeiramente partilhado.\", en: \"Building trust, deciding together, and cooperating around a genuinely shared goal.\" },\r\n  cat3QuemParticipa: { pt: \"Equipas, chefias intermédias e grupos formados há pouco tempo.\", en: \"Teams, middle managers, and recently formed groups.\" },\r\n  cat3Competencias: { pt: \"Cooperação · Liderança · Motivação · Tomada de decisão · Resolução de problemas\", en: \"Cooperation · Leadership · Motivation · Decision-making · Problem-solving\" },\r\n  cat4Titulo: { pt: \"Inteligência Artificial e Literacia Digital\", en: \"Artificial Intelligence and Digital Literacy\" },\r\n  cat4Tag1: { pt: \"IA no trabalho e na formação\", en: \"AI at work and in training\" },\r\n  cat4Tag2: { pt: \"Uso consciente de ferramentas de IA\", en: \"Mindful use of AI tools\" },\r\n  cat4Tag3: { pt: \"Pensamento crítico\", en: \"Critical thinking\" },\r\n  cat4Tag4: { pt: \"Validação da informação gerada\", en: \"Validating AI-generated information\" },\r\n  cat4Tag5: { pt: \"IA como apoio ao raciocínio humano\", en: \"AI as support for human reasoning\" },\r\n  cat4Objetivo: { pt: \"Usar ferramentas de IA com critério, mantendo o raciocínio e a decisão do lado humano.\", en: \"Using AI tools with good judgement, keeping reasoning and decision-making on the human side.\" },\r\n  cat4QuemParticipa: { pt: \"Equipas técnicas e administrativas, formadores, docentes e quadros intermédios.\", en: \"Technical and administrative teams, trainers, teaching staff and middle management.\" },\r\n  cat4Competencias: { pt: \"Literacia digital · Pensamento crítico · Validação de fontes · Uso responsável de IA\", en: \"Digital literacy · Critical thinking · Source validation · Responsible use of AI\" },\r\n  labelObjetivo: { pt: \"Objetivo\", en: \"Objective\" },\r\n  labelQuemParticipa: { pt: \"Quem participa\", en: \"Who takes part\" },\r\n  labelCompetencias: { pt: \"Competências trabalhadas\", en: \"Skills covered\" },\r\n  labelDuracao: { pt: \"Duração\", en: \"Duration\" },\r\n  textoDuracao: { pt: \"De sessões pontuais a percursos de várias semanas.\", en: \"From one-off sessions to programmes spanning several weeks.\" },\r\n  labelModalidade: { pt: \"Modalidade\", en: \"Format\" },\r\n  textoModalidade: { pt: \"Presencial ou online.\", en: \"In person or online.\" },\r\n  labelDesenhoMedida: { pt: \"Desenho à medida\", en: \"Tailor-made design\" },\r\n  textoDesenhoMedida: { pt: \"Conteúdos, casos e atividades construídos a partir do contexto específico de cada organização.\", en: \"Content, case studies and activities built around each organisation's specific context.\" },\r\n  formacoesRodape: { pt: \"Indique os objetivos e o perfil dos participantes. A proposta é construída a partir dessa informação.\", en: \"Tell me the objectives and the participants' profile. The proposal is built from that information.\" },\r\n  bloco1Titulo: { pt: \"Soft Skills\", en: \"Soft Skills\" },\r\n  bloco2Titulo: { pt: \"Ação Educativa\", en: \"Educational Practice\" },\r\n  bloco3Titulo: { pt: \"Mediação Intercultural\", en: \"Intercultural Mediation\" },\r\n  bloco4Titulo: { pt: \"Digital e Redes Sociais\", en: \"Digital and Social Media\" },\r\n  labelCodigo: { pt: \"Código\", en: \"Code\" },\r\n  labelDesignacao: { pt: \"Designação\", en: \"Title\" },\r\n  verAreaLabel: { pt: \"Ver esta área em detalhe\", en: \"See this area in detail\" },\r\n  metodologiaEyebrow: { pt: \"Metodologia de trabalho\", en: \"Working methodology\" },\r\n  metodologiaTitulo: { pt: \"Do diagnóstico inicial aos resultados que permanecem após a formação.\", en: \"From the initial diagnosis to results that last beyond the training.\" },\r\n  tagGamificacao: { pt: \"Gamificação\", en: \"Gamification\" },\r\n  tagJogosPedagogicos: { pt: \"Jogos pedagógicos\", en: \"Educational games\" },\r\n  tagDinamicasGrupo: { pt: \"Dinâmicas de grupo\", en: \"Group dynamics\" },\r\n  tagEstudosCaso: { pt: \"Estudos de caso\", en: \"Case studies\" },\r\n  tagSimulacoes: { pt: \"Simulações\", en: \"Simulations\" },\r\n  tagDesafiosEquipa: { pt: \"Desafios em equipa\", en: \"Team challenges\" },\r\n  tagReflexaoEstruturada: { pt: \"Momentos de reflexão estruturada\", en: \"Structured reflection moments\" },\r\n  tagAprendizagemPares: { pt: \"Aprendizagem entre pares\", en: \"Peer learning\" },\r\n  tagFacilitacaoGrupos: { pt: \"Facilitação de grupos\", en: \"Group facilitation\" },\r\n  etapa1: { pt: \"Etapa 01\", en: \"Stage 01\" },\r\n  etapa1Titulo: { pt: \"Diagnosticar\", en: \"Diagnose\" },\r\n  etapa1Texto: { pt: \"Uma reunião inicial para compreender o contexto organizacional, os objetivos e o perfil dos participantes.\", en: \"An initial meeting to understand the organisational context, the objectives and the participants' profile.\" },\r\n  etapa2: { pt: \"Etapa 02\", en: \"Stage 02\" },\r\n  etapa2Titulo: { pt: \"Conceber\", en: \"Design\" },\r\n  etapa2Texto: { pt: \"Guião de sessão, atividades, materiais pedagógicos e ritmo, desenhados a partir desse diagnóstico.\", en: \"Session outline, activities, learning materials and pacing, designed from that diagnosis.\" },\r\n  etapa3: { pt: \"Etapa 03\", en: \"Stage 03\" },\r\n  etapa3Titulo: { pt: \"Facilitar\", en: \"Facilitate\" },\r\n  etapa3Texto: { pt: \"Em sala, os participantes experimentam, analisam, decidem e confrontam perspetivas.\", en: \"In the room, participants experiment, analyse, decide and confront different perspectives.\" },\r\n  etapa4: { pt: \"Etapa 04\", en: \"Stage 04\" },\r\n  etapa4Titulo: { pt: \"Consolidar\", en: \"Consolidate\" },\r\n  etapa4Texto: { pt: \"A sessão encerra com ferramentas, registos e compromissos individuais transferíveis para a prática profissional.\", en: \"The session closes with tools, takeaways and individual commitments that transfer into professional practice.\" },\r\n  recursosEyebrow: { pt: \"Recursos pedagógicos\", en: \"Learning resources\" },\r\n  recursosTitulo: { pt: \"Materiais concebidos para continuarem a ser utilizados.\", en: \"Materials designed to keep being used.\" },\r\n  recursosTexto: { pt: \"Cada recurso responde a uma necessidade concreta: um jogo para estruturar uma conversa difícil, cartas para reflexão em pares, um kit que a equipa mantém em utilização após a formação.\", en: \"Each resource addresses a concrete need: a game to structure a difficult conversation, cards for peer reflection, a kit the team keeps using after the training ends.\" },\r\n  recCartas: { pt: \"Cartas e baralhos de reflexão\", en: \"Reflection cards and decks\" },\r\n  recGuioes: { pt: \"Guiões de atividades\", en: \"Activity guides\" },\r\n  recManuais: { pt: \"Manuais e materiais de apoio\", en: \"Manuals and supporting materials\" },\r\n  recApresentacoes: { pt: \"Apresentações interativas\", en: \"Interactive presentations\" },\r\n  recVisuais: { pt: \"Recursos visuais\", en: \"Visual resources\" },\r\n  recKits: { pt: \"Kits para dinamizar sessões\", en: \"Session facilitation kits\" },\r\n  recPercursos: { pt: \"Percursos formativos completos\", en: \"Complete training paths\" },\r\n  portefolioEyebrow: { pt: \"Portefólio\", en: \"Portfolio\" },\r\n  portefolioTitulo: { pt: \"Projetos e formações desenvolvidas.\", en: \"Projects and courses delivered.\" },\r\n  portefolioTexto: { pt: \"Três exemplos do processo completo: conceção da sessão, facilitação em contexto e produção dos materiais pedagógicos.\", en: \"Three examples of the full process: session design, on-the-ground facilitation, and production of the learning materials.\" },\r\n  caso1Tag: { pt: \"Formação\", en: \"Training\" },\r\n  caso1Titulo: { pt: \"Gestão de conflitos e comunicação\", en: \"Conflict management and communication\" },\r\n  labelQuemParticipou: { pt: \"Quem participou:\", en: \"Who took part:\" },\r\n  caso1QuemParticipou: { pt: \"colaboradores da empresa, 16 pessoas\", en: \"company employees, 16 people\" },\r\n  labelObjetivoInline: { pt: \"Objetivo:\", en: \"Objective:\" },\r\n  caso1Objetivo: { pt: \"comunicar melhor entre pares, lidar com o conflito de forma construtiva e reforçar o trabalho em equipa.\", en: \"communicating better between peers, handling conflict constructively, and strengthening teamwork.\" },\r\n  caso1Texto: { pt: \"Sessão desenhada à medida da organização, com estudos de caso, dinâmicas em equipa e exercícios ligados ao dia a dia dos participantes. A tarde fechou com atividades de teambuilding centradas na confiança, na comunicação e na cooperação do grupo.\", en: \"A session tailor-made for the organisation, with case studies, team dynamics and exercises tied to participants' day-to-day reality. The afternoon closed with team-building activities focused on trust, communication and group cooperation.\" },\r\n  caso2Titulo: { pt: \"Comunicação e gestão de conflitos\", en: \"Communication and conflict management\" },\r\n  caso2QuemParticipou: { pt: \"adultos em contexto empresarial\", en: \"adults in a corporate setting\" },\r\n  caso2Objetivo: { pt: \"encontrar formas mais claras de comunicar e usar o conflito como ponto de partida para colaborar.\", en: \"finding clearer ways to communicate and using conflict as a starting point for collaboration.\" },\r\n  caso2Texto: { pt: \"Workshop construído em torno da participação: simulações, desafios em equipa, momentos de reflexão e ferramentas prontas a usar no contexto profissional.\", en: \"A workshop built around participation: simulations, team challenges, reflection moments and tools ready to use in a professional context.\" },\r\n  caso3Tag: { pt: \"Recurso pedagógico\", en: \"Learning resource\" },\r\n  caso3Titulo: { pt: \"Encontrar o Norte\", en: \"Finding North\" },\r\n  caso3Projeto: { pt: \"Projeto próprio · 2026\", en: \"Own project · 2026\" },\r\n  labelParaQuem: { pt: \"Para quem:\", en: \"Who it's for:\" },\r\n  caso3ParaQuem: { pt: \"formadores, facilitadores e quem dinamiza grupos\", en: \"trainers, facilitators and anyone who runs group sessions\" },\r\n  caso3Objetivo: { pt: \"dar a quem dinamiza um recurso gamificado para abrir conversas, provocar reflexão e trabalhar competências com o grupo em ação.\", en: \"giving facilitators a gamified resource to open conversations, spark reflection, and work on skills with the group in action.\" },\r\n  caso3Texto: { pt: \"Jogo pedagógico criado de raiz, com desafios, cartas e momentos de reflexão que se adaptam a públicos e contextos diferentes.\", en: \"An educational game built from scratch, with challenges, cards and reflection moments that adapt to different audiences and contexts.\" },\r\n  testemunhosEyebrow: { pt: \"Testemunhos\", en: \"Testimonials\" },\r\n  test1Texto: { pt: \"Foi uma formação muito diferente do habitual. A Juliana conseguiu criar um ambiente de grande participação, onde todos contribuíram, refletiram e saíram com ferramentas que fizeram sentido para o nosso contexto de trabalho.\", en: \"This was a very different kind of training. Juliana managed to create an environment of real participation, where everyone contributed, reflected, and left with tools that made sense for our work context.\" },\r\n  test1Autor: { pt: \"Direção de Recursos Humanos\", en: \"Human Resources Management\" },\r\n  test2Texto: { pt: \"A forma como dinamiza as sessões faz com que o tempo passe a correr. Entre atividades, desafios e momentos de reflexão, aprendemos de forma natural e saímos com vontade de aplicar o que trabalhámos.\", en: \"The way she runs the sessions makes the time fly by. Between activities, challenges and moments of reflection, we learned naturally and left wanting to apply what we'd worked on.\" },\r\n  test2Autor: { pt: \"Participante em ação de formação\", en: \"Participant in a training course\" },\r\n  test3Texto: { pt: \"Destacamos a capacidade da Juliana para adaptar cada formação ao grupo, tornando os conteúdos acessíveis, relevantes e práticos. A combinação entre criatividade, organização e metodologias participativas fez toda a diferença na experiência dos participantes.\", en: \"We'd highlight Juliana's ability to adapt every course to the group, making the content accessible, relevant and practical. The combination of creativity, organisation and participatory methods made all the difference to participants' experience.\" },\r\n  test3Autor: { pt: \"Entidade parceira\", en: \"Partner organisation\" },\r\n  contactosEyebrow: { pt: \"Contactos\", en: \"Contact\" },\r\n  contactosTitulo: { pt: \"Descreva o grupo. A formação é construída a partir daí.\", en: \"Describe the group. The course is built from there.\" },\r\n  contactosTexto: { pt: \"Trabalho com empresas, municípios, entidades públicas, escolas, universidades, associações e entidades formadoras, em formação presencial e online em todo o país. Envie o contexto e os objetivos pretendidos — a resposta inclui uma proposta de formação à medida dos participantes.\", en: \"I work with companies, municipalities, public bodies, schools, universities, associations and training providers, delivering training in person and online across the country. Send me the context and the objectives you have in mind — you'll get back a tailor-made training proposal for your participants.\" },\r\n  labelEmail: { pt: \"E-mail\", en: \"Email\" },\r\n  campoNome: { pt: \"Nome\", en: \"Name\" },\r\n  campoOrganizacao: { pt: \"Organização\", en: \"Organisation\" },\r\n  campoContacto: { pt: \"Contacto\", en: \"Phone\" },\r\n  campoAreaInteresse: { pt: \"Área de interesse\", en: \"Area of interest\" },\r\n  campoParticipantes: { pt: \"Nº aproximado de participantes\", en: \"Approx. number of participants\" },\r\n  campoMensagem: { pt: \"Mensagem\", en: \"Message\" },\r\n  phNome: { pt: \"O seu nome\", en: \"Your name\" },\r\n  phOrganizacao: { pt: \"Empresa, município, escola, associação\", en: \"Company, municipality, school, association\" },\r\n  phEmail: { pt: \"nome@organizacao.pt\", en: \"name@organisation.com\" },\r\n  phTelefone: { pt: \"Telefone (opcional)\", en: \"Phone (optional)\" },\r\n  phParticipantes: { pt: \"Ex.: 12 a 15\", en: \"E.g.: 12 to 15\" },\r\n  phMensagem: { pt: \"Descreva o contexto, o perfil dos participantes e os objetivos da formação.\", en: \"Describe the context, the participants' profile and the objectives of the training.\" },\r\n  opcaoCombinado: { pt: \"Percurso combinado / a definir\", en: \"Combined path / to be defined\" },\r\n  consentimentoTexto: { pt: \"Li e aceito a \", en: \"I have read and accept the \" },\r\n  politicaPrivacidadeLabel: { pt: \"Política de Privacidade\", en: \"Privacy Policy\" },\r\n  enviarMensagem: { pt: \"Enviar mensagem\", en: \"Send message\" },\r\n  aEnviarLabel: { pt: \"A enviar…\", en: \"Sending…\" },\r\n  notaInativo: { pt: \"Os dados enviados servem apenas para responder ao seu pedido.\", en: \"The information you send is used only to reply to your enquiry.\" },\r\n  notaOk: { pt: \"Mensagem enviada. Obrigada — respondo assim que possível.\", en: \"Message sent. Thank you — I'll get back to you as soon as I can.\" },\r\n  notaErro: { pt: \"Não foi possível enviar a mensagem. Tente novamente ou escreva para jmatosaraujo99@gmail.com.\", en: \"The message couldn't be sent. Please try again or write to jmatosaraujo99@gmail.com.\" },\r\n  ctaTitulo: { pt: \"A próxima formação começa com uma conversa.\", en: \"The next course starts with a conversation.\" },\r\n  ctaBotao: { pt: \"Marcar uma conversa\", en: \"Book a conversation\" },\r\n  footerTitulo: { pt: \"Desenhado ao detalhe. Feito com o grupo.\", en: \"Designed down to the detail. Made with the group.\" },\r\n  footerPresencialOnline: { pt: \"Presencial e online\", en: \"In person and online\" }\r\n};\r\n\r\nclass Component extends DCLogic {\r\n  state = { menu: false, secao: '', blocos: { 1: true, 2: false, 3: false, 4: false }, envio: 'inativo', idioma: (typeof localStorage !== 'undefined' && localStorage.getItem('idioma') === 'en') ? 'en' : 'pt' };\r\n\r\n  videoRef = React.createRef();\r\n  barraRef = React.createRef();\r\n\r\n  nomes = {\r\n    sobre: 'navSobre', formacoes: 'navFormacoes', metodologia: 'navMetodologia',\r\n    recursos: 'navRecursos', portefolio: 'navPortefolio', galeria: 'galeriaEyebrow', contactos: 'navContactos'\r\n  };\r\n\r\n  componentDidMount() {\r\n    const veil = document.getElementById('__ja_veil');\r\n    if (veil) {\r\n      veil.style.opacity = '0';\r\n      setTimeout(function() { veil.remove(); }, 380);\r\n    }\r\n    const v = this.videoRef.current;\r\n    if (v) { v.muted = true; const p = v.play(); if (p && p.catch) p.catch(() => {}); }\r\n    document.querySelectorAll('video').forEach(el => { el.muted = true; const q = el.play(); if (q && q.catch) q.catch(() => {}); });\r\n\r\n    this.onScroll = () => {\r\n      // Marca o documento (fora da árvore do React) para o CSS compactar o cabeçalho\r\n      document.documentElement.toggleAttribute('data-scrolled', window.scrollY > 24);\r\n      const b = this.barraRef.current;\r\n      if (!b) return;\r\n      const h = document.documentElement.scrollHeight - window.innerHeight;\r\n      b.style.width = (h > 0 ? Math.min(100, Math.max(0, (window.scrollY / h) * 100)) : 0) + '%';\r\n    };\r\n    window.addEventListener('scroll', this.on
