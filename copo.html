<!doctype html><html lang="pt-PT"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Copo Cheio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Atividade de formação: os colegas deixam mensagens anónimas sobre o que veem de bom em cada pessoa, com temas para o verão, o Natal, o outono e a primavera.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Conceito: um objeto por pessoa (garrafa, árvore de Natal, árvore de outono, vaso) que se enche com as mensagens dos colegas.
   Base clara e arejada ao estilo Apple; cada tema muda o acento, o padrão de fundo, o chão e as partículas. */
:root{
  --mar:#1F2ED6; --mar-forte:#1522A8; --mar-claro:#E7EAFD; --mar-tinta:#0E1A8C;
  --fundo:#F5F6FB; --superficie:#FFFFFF; --superficie-2:#F0F2FA; --texto:#0B0D1A; --texto-2:#575C73; --linha:#E2E5F0;
  --papel:#F8F2E4; --papel-linha:#E6DCC4; --tinta:#23273B; --rolha:#B47B47; --rolha-escura:#8A5A30;
  --pos:#1A9566; --sug:#B97C00; --neu:#727892; --neg:#D9412F;
  --pos-bg:#E2F4EB; --sug-bg:#FBEFD5; --neu-bg:#ECEEF4; --neg-bg:#FBE4E0;
  --vidro:#1F2ED6; --vidro-borda:rgba(31,46,214,.55); --arvore:#1F6B43; --neve:#C9D3E8;
  --chao:color-mix(in srgb,#E6DCC4 45%,transparent); --q-fundo:#0A137A;
  --sombra:0 1px 2px rgba(14,26,140,.06),0 8px 28px rgba(14,26,140,.08); --padrao-op:.07;
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-corpo:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mao:'Caveat','Segoe Print','Bradley Hand',cursive;
  --raio:18px;
}
:root[data-tema="natal"]{--mar:#B3192B;--mar-forte:#8E1222;--mar-claro:#FBE3E5;--mar-tinta:#7A0F1C;--fundo:#FBF8F3;--superficie-2:#F5EFE6;--linha:#ECE3D6;
  --papel:#FFF8EC;--papel-linha:#EADBC4;--q-fundo:#0D3A24;--chao:#FFFFFF;--sombra:0 1px 2px rgba(90,20,20,.06),0 8px 28px rgba(90,20,20,.08)}
:root[data-tema="outono"]{--mar:#B4501A;--mar-forte:#923F12;--mar-claro:#FBE7D8;--mar-tinta:#7A3510;--fundo:#FBF5EC;--superficie-2:#F6EEE2;--linha:#EDE1D0;
  --papel:#EFDDBF;--papel-linha:#DBC49E;--q-fundo:#3A1D12;--chao:color-mix(in srgb,#C9874B 32%,transparent);--sombra:0 1px 2px rgba(90,45,10,.06),0 8px 28px rgba(90,45,10,.08)}
:root[data-tema="primavera"]{--mar:#2E7D4F;--mar-forte:#22603C;--mar-claro:#E2F3E8;--mar-tinta:#1D5535;--fundo:#F5FAF3;--superficie-2:#EEF6EC;--linha:#E0ECDD;
  --papel:#FFFDF7;--papel-linha:#EDE6D3;--q-fundo:#123F2E;--chao:color-mix(in srgb,#7CC47F 38%,transparent);--sombra:0 1px 2px rgba(20,70,40,.06),0 8px 28px rgba(20,70,40,.08)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mar:#7884FF; --mar-forte:#A3ABFF; --mar-claro:#161E58; --mar-tinta:#C9CEFF;
    --fundo:#070B22; --superficie:#0F1539; --superficie-2:#141B45; --texto:#EEF0FF; --texto-2:#A2A8C8; --linha:#222B5E;
    --pos:#45C892; --sug:#E2A93A; --neu:#9AA0BC; --neg:#FF7A68; --pos-bg:#0F3427; --sug-bg:#3A2C0C; --neu-bg:#1B2148; --neg-bg:#3D1712;
    --vidro:#8C96FF; --vidro-borda:rgba(150,160,255,.7); --arvore:#3C9A66; --neve:#E8EEF7; --chao:color-mix(in srgb,#E6DCC4 18%,transparent);
    --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --padrao-op:.09; color-scheme:dark}
  :root[data-tema="natal"]:not([data-theme="light"]){--mar:#FF7482;--mar-forte:#FFA0A9;--mar-claro:#3A1218;--mar-tinta:#FFC9CE;--fundo:#0B1410;--superficie:#122019;--superficie-2:#172A20;--linha:#24392D;--chao:#DDE6F2}
  :root[data-tema="outono"]:not([data-theme="light"]){--mar:#F08A4B;--mar-forte:#F6A877;--mar-claro:#3A1E10;--mar-tinta:#FFD1B3;--fundo:#140C08;--superficie:#21150E;--superficie-2:#2A1B12;--linha:#3B281B;--chao:color-mix(in srgb,#C9874B 22%,transparent)}
  :root[data-tema="primavera"]:not([data-theme="light"]){--mar:#5CC98A;--mar-forte:#8ADBAA;--mar-claro:#12331F;--mar-tinta:#C4F0D3;--fundo:#08140D;--superficie:#0F2017;--superficie-2:#14291D;--linha:#21392B;--chao:color-mix(in srgb,#7CC47F 22%,transparent)}
}
:root[data-theme="dark"]{
  --mar:#7884FF; --mar-forte:#A3ABFF; --mar-claro:#161E58; --mar-tinta:#C9CEFF;
  --fundo:#070B22; --superficie:#0F1539; --superficie-2:#141B45; --texto:#EEF0FF; --texto-2:#A2A8C8; --linha:#222B5E;
  --pos:#45C892; --sug:#E2A93A; --neu:#9AA0BC; --neg:#FF7A68; --pos-bg:#0F3427; --sug-bg:#3A2C0C; --neu-bg:#1B2148; --neg-bg:#3D1712;
  --vidro:#8C96FF; --vidro-borda:rgba(150,160,255,.7); --arvore:#3C9A66; --neve:#E8EEF7; --chao:color-mix(in srgb,#E6DCC4 18%,transparent);
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); --padrao-op:.09; color-scheme:dark}
:root[data-theme="dark"][data-tema="natal"]{--mar:#FF7482;--mar-forte:#FFA0A9;--mar-claro:#3A1218;--mar-tinta:#FFC9CE;--fundo:#0B1410;--superficie:#122019;--superficie-2:#172A20;--linha:#24392D;--chao:#DDE6F2}
:root[data-theme="dark"][data-tema="outono"]{--mar:#F08A4B;--mar-forte:#F6A877;--mar-claro:#3A1E10;--mar-tinta:#FFD1B3;--fundo:#140C08;--superficie:#21150E;--superficie-2:#2A1B12;--linha:#3B281B;--chao:color-mix(in srgb,#C9874B 22%,transparent)}
:root[data-theme="dark"][data-tema="primavera"]{--mar:#5CC98A;--mar-forte:#8ADBAA;--mar-claro:#12331F;--mar-tinta:#C4F0D3;--fundo:#08140D;--superficie:#0F2017;--superficie-2:#14291D;--linha:#21392B;--chao:color-mix(in srgb,#7CC47F 22%,transparent)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--fundo);color:var(--texto);font-family:var(--f-corpo);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s}
body::after{content:"";position:fixed;inset:0;background-image:var(--padrao);background-size:72px 72px;opacity:var(--padrao-op);pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(180deg,#000 0,transparent 340px);mask-image:linear-gradient(180deg,#000 0,transparent 340px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--superficie)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.envolve{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* Barra de topo */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--superficie) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--linha)}
.topo .envolve{display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;background:none;border:0;padding:0;cursor:pointer}
.marca svg{width:20px;height:28px;display:block}
.topo .esp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;background:var(--superficie-2);color:var(--texto-2);border:1px solid var(--linha);white-space:nowrap}
.chip.mar{background:var(--mar-claro);color:var(--mar-tinta);border-color:transparent}
.chip b{font-family:var(--f-display);letter-spacing:.06em;color:var(--texto)}
button.chip{cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--mar);color:#fff;border-color:transparent}
/* Barra da demonstração */
.demo{position:relative;z-index:2;background:var(--q-fundo);color:#fff}
.demo .envolve{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:8px;font-size:13.5px}
.demo .seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.demo .seg button{border:0;background:none;color:#fff;padding:5px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px}
.demo .seg button[aria-pressed="true"]{background:#fff;color:var(--q-fundo)}
.demo .lnk{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px;padding:4px}
/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid transparent;padding:12px 22px;font-weight:600;font-size:15.5px;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s;text-decoration:none;min-height:46px}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--mar);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--mar) 35%,transparent)}
:root[data-theme="dark"] .btn-p,:root[data-theme="dark"] button.chip[aria-pressed="true"]{color:#0B0D1A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-p,:root:not([data-theme="light"]) button.chip[aria-pressed="true"]{color:#0B0D1A}}
.btn-p:hover{background:var(--mar-forte)}
.btn-s{background:var(--superficie);border-color:var(--linha);color:var(--texto)}
.btn-s:hover{border-color:var(--mar)}
.btn-t{background:none;color:var(--texto-2);padding:10px 14px}
.btn-t:hover{color:var(--texto)}
.btn-perigo{background:var(--neg-bg);color:var(--neg)}
.btn-peq{padding:7px 14px;min-height:36px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--mar) 60%,transparent);outline-offset:2px;border-radius:10px}
/* Cartões e campos */
.cartao{background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra)}
.campo{display:grid;gap:6px}
.campo label{font-size:13px;font-weight:600;color:var(--texto-2);letter-spacing:.02em}
.campo input{border:1px solid var(--linha);background:var(--superficie);border-radius:14px;padding:13px 15px;font-size:17px;outline:none;transition:border .15s,box-shadow .15s;width:100%}
.campo input:focus{border-color:var(--mar);box-shadow:0 0 0 4px color-mix(in srgb,var(--mar) 18%,transparent)}
.campo input.codigo{font-family:var(--f-display);font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:24px;text-align:center}
.nota{font-size:13px;color:var(--texto-2)}
.rotulo{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mar)}
/* Seletor de temas */
.temas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tema-op{position:relative;display:grid;justify-items:center;gap:6px;padding:12px 6px 10px;border-radius:14px;border:1px solid var(--linha);background:var(--superficie);cursor:pointer;text-align:center;transition:border .15s,box-shadow .15s}
.tema-op input{position:absolute;opacity:0;pointer-events:none}
.tema-op:has(input:checked){border-color:var(--mar);box-shadow:0 0 0 3px color-mix(in srgb,var(--mar) 22%,transparent)}
.tema-op:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--mar) 60%,transparent)}
.tema-op strong{display:block;font-size:13px;line-height:1.2}
.tema-op .nota{font-size:11.5px}
.tema-op .ilu{height:88px;display:grid;place-items:end center}
/* Recipientes */
.rec{display:block;overflow:visible}
.rec .g-rolha,.rec .g-estrela{transform-box:fill-box;transform-origin:50% 50%}
.anima{animation:flutua 5s ease-in-out infinite;transform-origin:50% 95%}
[data-tema="natal"] .anima,[data-tema="outono"] .anima,[data-tema="primavera"] .anima{animation-name:balanca}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes balanca{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
.papel-in{animation:cai .5s cubic-bezier(.3,1.4,.6,1) both}
@keyframes cai{from{transform:translateY(-30px) scale(.4);opacity:0}}
.luz{opacity:.35}
.aceso .luz{animation:pisca 1.6s ease-in-out infinite}
@keyframes pisca{0%,100%{opacity:.25}50%{opacity:1}}
.aceso .brilho{animation:brilha 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes brilha{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.7;transform:scale(1.15)}}
.flor-in{animation:desabrocha .6s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes desabrocha{from{transform:scale(.2) rotate(-60deg);opacity:.3}}
/* Partículas (neve, folhas, pétalas, bolhas) */
.chuva{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.chuva i{position:absolute;left:var(--x);top:-8%;width:var(--s);height:var(--s);animation:cair var(--d) linear var(--atraso) infinite}
@keyframes cair{from{top:-8%;transform:translateX(0) rotate(0)}to{top:108%;transform:translateX(var(--dx)) rotate(var(--r))}}
@keyframes subir{from{top:108%;transform:translateX(0)}to{top:-8%;transform:translateX(var(--dx))}}
.chuva-verao i{border-radius:50%;border:1.5px solid color-mix(in srgb,var(--vidro) 40%,transparent);animation-name:subir}
.chuva-verao.proj i{border-color:rgba(255,255,255,.3)}
.chuva-natal i{border-radius:50%;background:var(--neve)}
.chuva-natal.proj i{background:#fff;opacity:.85}
.chuva-outono i{border-radius:0 80% 0 80%;opacity:.9}
.chuva-primavera i{border-radius:80% 0 80% 0;opacity:.9}
/* Início */
.heroi{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;padding-block:48px 24px}
.heroi h1{font-size:clamp(44px,7.4vw,88px);font-weight:800;letter-spacing:-.04em}
.heroi h1 span{color:var(--mar)}
.heroi .lead{font-size:clamp(17px,1.9vw,20px);color:var(--texto-2);max-width:36ch;margin-top:18px}
.heroi .acoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.ver-temas{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:20px}
.cena{position:relative;aspect-ratio:1/1;max-width:420px;width:100%;justify-self:center;border-radius:32px;overflow:hidden}
.cena{background:radial-gradient(90% 70% at 50% 35%,var(--mar-claro),transparent 72%)}
.cena .g1{position:absolute;left:29%;top:3%;width:42%;z-index:2}
.ondas{position:absolute;left:-10%;right:-10%;bottom:6%;height:34%;overflow:hidden;z-index:3}
.ondas svg{position:absolute;bottom:0;width:200%;height:100%;animation:onda 14s linear infinite}
.ondas svg.o2{animation-duration:9s;opacity:.55;bottom:-6px}
@keyframes onda{to{transform:translateX(-50%)}}
.chao{position:absolute;left:4%;right:4%;bottom:4%;height:14%;border-radius:50% 50% 12px 12px/100% 100% 12px 12px;background:var(--chao);z-index:1}
.tema-natal .chao{box-shadow:inset 0 6px 12px rgba(120,140,170,.18)}
.sol{position:absolute;right:9%;top:8%;width:15%;aspect-ratio:1;border-radius:50%;background:#F5B82E;box-shadow:0 0 0 8px rgba(245,184,46,.25),0 0 0 18px rgba(245,184,46,.12);z-index:1;animation:respira 4s ease-in-out infinite}
@keyframes respira{50%{box-shadow:0 0 0 12px rgba(245,184,46,.3),0 0 0 26px rgba(245,184,46,.1)}}
.passos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-block:8px 64px}
.passo{padding:18px;border-radius:var(--raio);background:var(--superficie);border:1px solid var(--linha)}
.passo .n{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--mar);line-height:1}
.passo h3{font-size:17px;margin:10px 0 4px;letter-spacing:-.01em}
.passo p{font-size:14px;color:var(--texto-2)}
.sessoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
/* Formulários centrados */
.centro{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:40px}
.form-cartao{width:min(520px,100%);padding:32px 28px;display:grid;gap:18px}
.form-cartao h2{font-size:30px}
.alternar{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--superficie-2);cursor:pointer}
.alternar input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--mar);flex:none}
.erro{color:var(--neg);font-size:14px;font-weight:600;min-height:1em}
/* Espera */
.espera{text-align:center;padding-block:56px;display:grid;justify-items:center;gap:14px}
.espera h2{font-size:clamp(30px,5vw,44px)}
.etiqueta-nome{font-family:var(--f-mao);font-size:30px;font-weight:700;color:var(--tinta);background:var(--papel);padding:2px 16px;border-radius:6px;transform:rotate(-3deg);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.lista-nomes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:640px}
/* Escrever */
.escrever{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;padding-block:28px 64px;align-items:start}
.cab-escrever{display:grid;gap:10px;margin-bottom:18px}
.cab-escrever h2{font-size:clamp(26px,3.6vw,36px)}
.barra{height:8px;border-radius:99px;background:var(--superficie-2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--mar);border-radius:99px;transition:width .5s}
.colegas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.colega{position:relative;display:grid;justify-items:center;gap:6px;padding:16px 10px 14px;border-radius:var(--raio);background:var(--superficie);border:1px solid var(--linha);cursor:pointer;transition:border .15s,transform .15s,box-shadow .15s;text-align:center}
.colega:hover{transform:translateY(-2px);box-shadow:var(--sombra)}
.colega[aria-current="true"]{border-color:var(--mar);box-shadow:0 0 0 3px color-mix(in srgb,var(--mar) 22%,transparent)}
.colega .nome{font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.colega .ilu{display:block}
.estado{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--superficie-2);color:var(--texto-2)}
.estado.feito{background:var(--mar-claro);color:var(--mar-tinta)}
.estado.passou{background:transparent;border:1px dashed var(--linha)}
.compositor{position:sticky;top:76px;padding:22px;display:grid;gap:14px}
.compositor .para{display:flex;align-items:center;gap:12px}
.compositor .para .ilu{width:46px;flex:none}
.compositor .para h3{font-size:24px}
.papel-escrita{position:relative;border-radius:6px 6px 14px 14px;background:var(--papel);
  background-image:repeating-linear-gradient(180deg,transparent 0 33px,var(--papel-linha) 33px 34px);background-position:0 18px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.08);padding:14px 18px 10px}
[data-tema="natal"] .papel-escrita{border-radius:14px;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #C8102E,0 6px 18px rgba(0,0,0,.08)}
[data-tema="outono"] .papel-escrita{border-radius:10px}
[data-tema="primavera"] .papel-escrita{border-radius:20px;box-shadow:inset 0 0 0 1px #E3EBD9,0 6px 18px rgba(0,0,0,.06)}
.papel-escrita textarea{width:100%;min-height:150px;border:0;background:transparent;resize:vertical;outline:none;font-family:var(--f-mao);font-size:27px;line-height:34px;color:var(--tinta)}
.papel-escrita textarea::placeholder{color:#A09780}
.papel-escrita .conta{position:absolute;right:12px;bottom:6px;font-size:12px;color:#8E8670;font-family:var(--f-corpo)}
.inicios{display:flex;gap:6px;flex-wrap:wrap}
.inicios button{border:1px solid var(--linha);background:var(--superficie);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--texto-2)}
.inicios button:hover{border-color:var(--mar);color:var(--texto)}
.tom{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:500;background:var(--neu-bg);color:var(--texto);transition:background .25s}
.tom .ponto{width:10px;height:10px;border-radius:50%;background:var(--neu);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--neu) 25%,transparent)}
.tom.positiva{background:var(--pos-bg)}.tom.positiva .ponto{background:var(--pos);box-shadow:0 0 0 4px color-mix(in srgb,var(--pos) 25%,transparent)}
.tom.sugestao{background:var(--sug-bg)}.tom.sugestao .ponto{background:var(--sug);box-shadow:0 0 0 4px color-mix(in srgb,var(--sug) 25%,transparent)}
.tom.negativa{background:var(--neg-bg)}.tom.negativa .ponto{background:var(--neg);box-shadow:0 0 0 4px color-mix(in srgb,var(--neg) 25%,transparent)}
.aviso-neg{display:grid;gap:10px;padding:14px;border-radius:14px;border:1px solid color-mix(in srgb,var(--neg) 40%,transparent);background:var(--neg-bg);font-size:14px}
.meus-papeis{display:grid;gap:8px}
.mini-papel{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--papel);border-radius:8px;color:var(--tinta);font-family:var(--f-mao);font-size:21px;line-height:1.15}
.mini-papel .x{margin-left:auto;font-family:var(--f-corpo);font-size:12px;border:0;background:none;color:#8E8670;cursor:pointer;white-space:nowrap;padding:4px}
.linha-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.anonimo{display:flex;gap:8px;font-size:12.5px;color:var(--texto-2);align-items:flex-start}
.anonimo svg{flex:none;margin-top:2px}
.fechar-sheet{display:none}
.vazio-comp{text-align:center;padding:36px 18px;display:grid;gap:10px;justify-items:center;color:var(--texto-2)}
/* Abrir */
.abrir{display:grid;gap:22px;padding-block:28px 64px}
.palco{position:relative;min-height:460px;border-radius:28px;overflow:hidden;background:
  radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--mar) 12%,transparent),transparent 60%),var(--superficie);border:1px solid var(--linha);display:grid;place-items:center}
.palco .gg{position:relative;z-index:2;width:min(220px,48vw);transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 85%;cursor:pointer}
.palco .gg.inclinada{transform:rotate(-22deg) translate(-10px,10px)}
.palco .chao{left:0;right:0;bottom:0;height:80px;border-radius:50% 50% 0 0/40px 40px 0 0}
[data-tema="verao"] .palco .chao,:root:not([data-tema]) .palco .chao{background:linear-gradient(180deg,transparent,var(--chao));border-radius:0;height:70px}
.palco .sol{width:64px;right:22px;top:22px}
.gota{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#5AA9E6;z-index:3;pointer-events:none}
.contador{position:absolute;bottom:16px;left:16px;font-weight:600;font-size:13px;color:var(--texto-2);z-index:3;background:color-mix(in srgb,var(--superficie) 80%,transparent);padding:4px 10px;border-radius:99px}
.contador:empty{display:none}
.controlos{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.papel-voo{position:absolute;left:50%;top:50%;width:min(520px,86%);z-index:5;transform-origin:50% 50%}
.papel-aberto{position:relative;background:var(--papel);color:var(--tinta);border-radius:6px;padding:34px 34px 30px;
  background-image:repeating-linear-gradient(180deg,transparent 0 41px,var(--papel-linha) 41px 42px);background-position:0 30px;
  box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.04)}
.papel-aberto::before,.papel-aberto::after{content:"";position:absolute;left:-6px;right:-6px;height:16px;border-radius:10px;background:linear-gradient(180deg,#EFE5CF,#DCCFAF)}
.papel-aberto::before{top:-8px}.papel-aberto::after{bottom:-8px}
[data-tema="natal"] .papel-aberto{border-radius:18px;background-image:none;box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 0 0 6px #fff,inset 0 0 0 9px #C8102E,inset 0 0 0 12px #fff,inset 0 0 0 14px #1F6B43}
[data-tema="natal"] .papel-aberto::before{left:50%;right:auto;top:-22px;width:22px;height:18px;border-radius:4px;transform:translateX(-50%);background:linear-gradient(90deg,#B89443,#F2D27A,#B89443)}
[data-tema="natal"] .papel-aberto::after{left:50%;right:auto;top:-34px;bottom:auto;width:16px;height:16px;border-radius:50%;background:none;border:3px solid #B89443;transform:translateX(-50%)}
[data-tema="outono"] .papel-aberto{border-radius:12px;background-image:repeating-linear-gradient(180deg,transparent 0 41px,var(--papel-linha) 41px 42px)}
[data-tema="outono"] .papel-aberto::before{left:auto;right:-14px;top:-18px;width:54px;height:54px;border-radius:0 80% 0 80%;background:#D9541E;transform:rotate(18deg);box-shadow:inset -6px -6px 0 rgba(0,0,0,.08)}
[data-tema="outono"] .papel-aberto::after{display:none}
[data-tema="primavera"] .papel-aberto{border-radius:26px;background-image:none;box-shadow:0 20px 50px rgba(0,0,0,.2),inset 0 0 0 1px #E3EBD9}
[data-tema="primavera"] .papel-aberto::before{left:50%;right:auto;top:-24px;width:44px;height:44px;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(circle,#F5B82E 0 7px,transparent 8px),radial-gradient(circle at 50% 12%,#E86A92 0 9px,transparent 10px),radial-gradient(circle at 88% 40%,#E86A92 0 9px,transparent 10px),radial-gradient(circle at 74% 86%,#E86A92 0 9px,transparent 10px),radial-gradient(circle at 26% 86%,#E86A92 0 9px,transparent 10px),radial-gradient(circle at 12% 40%,#E86A92 0 9px,transparent 10px)}
[data-tema="primavera"] .papel-aberto::after{display:none}
.papel-aberto p{font-family:var(--f-mao);font-size:clamp(28px,4.2vw,36px);line-height:42px;font-weight:500;overflow-wrap:anywhere}
.carimbo{position:absolute;top:-14px;right:18px;transform:rotate(8deg);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:8px;border:2px solid currentColor;background:var(--papel);z-index:2}
[data-tema="outono"] .carimbo{right:46px}
.carimbo.positiva{color:#1A7F57}.carimbo.sugestao{color:#A06A00}.carimbo.neutra{color:#6A6F86}.carimbo.negativa{color:#C23A2A}
.mesa h3{font-size:22px;margin-bottom:12px}
.mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mesa-papel{position:relative;background:var(--papel);color:var(--tinta);border-radius:6px;padding:18px 18px 16px;font-family:var(--f-mao);font-size:23px;line-height:1.2;box-shadow:0 6px 16px rgba(0,0,0,.08);overflow-wrap:anywhere}
[data-tema="natal"] .mesa-papel{border-radius:12px;border-top:5px solid #C8102E}
[data-tema="outono"] .mesa-papel{border-radius:10px 26px 10px 26px}
[data-tema="primavera"] .mesa-papel{border-radius:20px;border:1px solid #E3EBD9}
.mesa-papel .tag{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%}
.fim{display:grid;gap:14px;justify-items:center;text-align:center;padding:24px}
.fim h2{font-size:clamp(28px,4vw,40px)}
.resumo-tons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%}
.pill.positiva{background:var(--pos-bg)}.pill.positiva i{background:var(--pos)}
.pill.sugestao{background:var(--sug-bg)}.pill.sugestao i{background:var(--sug)}
.pill.neutra{background:var(--neu-bg)}.pill.neutra i{background:var(--neu)}
.pill.negativa{background:var(--neg-bg)}.pill.negativa i{background:var(--neg)}
/* Painel do formador */
.painel{padding-block:24px 64px;display:grid;gap:20px}
.cab-painel{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.cab-painel h2{font-size:clamp(26px,3.4vw,36px)}
.codigo-grande{font-family:var(--f-display);font-weight:800;letter-spacing:.14em;color:var(--mar)}
.fases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fase{display:grid;gap:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--linha);background:var(--superficie);text-align:left;cursor:pointer;transition:border .15s,background .15s}
.fase .t{font-weight:700;font-size:15px}.fase .d{font-size:12.5px;color:var(--texto-2)}
.fase .k{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--texto-2)}
.fase[aria-current="true"]{background:var(--mar);border-color:var(--mar);color:#fff}
.fase[aria-current="true"] .d,.fase[aria-current="true"] .k{color:rgba(255,255,255,.82)}
:root[data-theme="dark"] .fase[aria-current="true"]{color:#0B0D1A}
:root[data-theme="dark"] .fase[aria-current="true"] .d,:root[data-theme="dark"] .fase[aria-current="true"] .k{color:rgba(11,13,26,.75)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fase[aria-current="true"]{color:#0B0D1A}
  :root:not([data-theme="light"]) .fase[aria-current="true"] .d,:root:not([data-theme="light"]) .fase[aria-current="true"] .k{color:rgba(11,13,26,.75)}}
.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.numero{padding:16px 18px;border-radius:var(--raio);background:var(--superficie);border:1px solid var(--linha)}
.numero b{display:block;font-family:var(--f-display);font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.numero span{font-size:13px;color:var(--texto-2)}
.separadores{display:flex;gap:4px;border-bottom:1px solid var(--linha);overflow-x:auto}
.separadores button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--texto-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.separadores button[aria-selected="true"]{color:var(--texto);border-color:var(--mar)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--neg);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.cais{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px}
.doca{display:grid;justify-items:center;gap:6px;padding:14px 8px 12px;border-radius:var(--raio);background:var(--superficie);border:1px solid var(--linha);cursor:pointer;text-align:center}
.doca:hover{box-shadow:var(--sombra)}
.doca .ilu{display:block}
.doca .nome{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.2}
.doca .n{font-size:12.5px;color:var(--texto-2)}
.barra-tons{display:flex;width:80%;height:5px;border-radius:9px;overflow:hidden;background:var(--superficie-2)}
.barra-tons i{display:block;height:100%}
.vazio{padding:40px 18px;text-align:center;color:var(--texto-2);display:grid;gap:8px;justify-items:center}
.rever-lista{display:grid;gap:12px}
.rever-item{display:grid;gap:10px;padding:16px;border-radius:var(--raio);background:var(--superficie);border:1px solid var(--linha)}
.rever-item .txt{font-family:var(--f-mao);font-size:24px;line-height:1.2;background:var(--papel);color:var(--tinta);padding:12px 14px;border-radius:8px}
.meta-msg{font-size:13px;color:var(--texto-2);display:flex;gap:10px;flex-wrap:wrap}
.tabela-env{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio);background:var(--superficie)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--linha);vertical-align:middle;white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);font-weight:700;background:var(--superficie-2)}
td.num{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.def{display:grid;gap:14px;max-width:680px}
.chave{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chave code{font-size:14px;padding:8px 12px;border-radius:10px;background:var(--superficie-2);border:1px solid var(--linha);user-select:all;overflow-wrap:anywhere}
/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(7,11,34,.55);backdrop-filter:blur(6px)}
.modal .caixa{width:min(680px,100%);max-height:86vh;overflow:auto;padding:26px;display:grid;gap:16px}
.modal .caixa .cab{display:flex;gap:14px;align-items:center}
.modal .lista-papeis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
/* Quadro projetado */
.quadro{position:fixed;inset:0;z-index:60;background:var(--q-fundo);color:#fff;overflow:auto;--arvore:#3FA36B;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px))}
.quadro::before{content:"";position:fixed;inset:0;background-image:var(--padrao-claro);background-size:96px 96px;opacity:.07;pointer-events:none}
.quadro .chuva{position:fixed}
.quadro > #q-conteudo{position:relative;z-index:1}
.quadro .q-topo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.quadro .q-topo h2{font-size:clamp(28px,4vw,52px);font-weight:800;color:#fff}
.quadro .q-topo .esp{flex:1}
.quadro .sair{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:10px 16px;font-weight:600;cursor:pointer}
.quadro .q-sub{color:rgba(255,255,255,.78);font-size:clamp(16px,1.8vw,22px);margin-top:6px}
.q-entrada{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center;margin-top:36px}
.q-qr{background:#fff;padding:18px;border-radius:24px;display:grid;justify-items:center;gap:8px;color:var(--q-fundo)}
.q-qr .cod{font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:.2em}
.q-url{font-size:clamp(18px,2.2vw,28px);font-weight:600;overflow-wrap:anywhere}
.q-nomes{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.q-nomes span{background:rgba(255,255,255,.14);padding:8px 16px;border-radius:99px;font-weight:600;font-size:18px;animation:entra .5s cubic-bezier(.3,1.4,.6,1) both}
@keyframes entra{from{transform:scale(.6);opacity:0}}
.q-cais{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,170px));justify-content:center;gap:20px 14px;margin-top:30px}
.q-doca{display:grid;justify-items:center;gap:6px;text-align:center}
.q-doca .ilu{display:grid;place-items:end center}
.q-doca .nome{font-weight:700;font-size:18px}
.q-doca .n{font-size:14px;color:rgba(255,255,255,.72)}
.q-progresso{height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:18px;max-width:640px}
.q-progresso i{display:block;height:100%;background:#fff;transition:width .6s}
.nuvem{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:center;margin:34px auto 0;max-width:980px}
.nuvem span{font-family:var(--f-mao);font-weight:700;line-height:1}
.q-numeros{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.q-numeros b{display:block;font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.q-numeros span{color:rgba(255,255,255,.72);font-size:15px}
/* Toast */
.toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;
  background:var(--texto);color:var(--fundo);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Responsivo */
@media (max-width:980px){
  .escrever{grid-template-columns:1fr}
  .compositor{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .35s cubic-bezier(.3,1,.4,1);
    padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .compositor.aberto{transform:none}
  .fechar-sheet{display:inline-flex;margin-left:auto}
  .vazio-comp{display:none}
}
@media (max-width:760px){
  .heroi{grid-template-columns:1fr;padding-block:24px 8px;gap:8px}
  .cena{max-width:280px;order:-1}
  .passos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fases,.numeros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .temas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .q-entrada{grid-template-columns:1fr;gap:24px}
  .colegas{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .palco{min-height:400px}
  .papel-aberto{padding:28px 22px 24px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Novidades: ferramentas, dicas, relógio, contagem, agradecimentos ---------- */
.ferramentas{display:flex;gap:6px;align-items:center}
.icone-btn{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 9px;border-radius:999px;border:1px solid var(--linha);background:var(--superficie);color:var(--texto);font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.02em}
.icone-btn:hover{border-color:var(--mar)}
.icone-btn[aria-pressed="true"]{background:var(--mar-claro);color:var(--mar-tinta);border-color:transparent}
.lnk-simples{padding:0;border:0;background:none;cursor:pointer;text-decoration:underline;color:inherit;font:inherit}
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.linguas{display:flex;gap:8px;flex-wrap:wrap}
.lingua-op{position:relative;display:inline-flex;align-items:center;padding:9px 16px;border-radius:999px;border:1px solid var(--linha);background:var(--superficie);cursor:pointer;font-weight:600;font-size:14px}
.lingua-op input{position:absolute;opacity:0;pointer-events:none}
.lingua-op:has(input:checked){border-color:var(--mar);background:var(--mar-claro);color:var(--mar-tinta)}
.lingua-op:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--mar) 60%,transparent)}
.priv{font-size:13px;color:var(--texto-2);border-top:1px solid var(--linha);padding-top:12px}
.priv summary{cursor:pointer;font-weight:600;color:var(--texto)}
.priv p{margin-top:8px;line-height:1.55}
.dicas{border:1px solid var(--linha);border-radius:14px;padding:10px 14px;background:var(--superficie-2)}
.dicas summary{cursor:pointer;font-weight:600;font-size:14px}

function tomNormalizar(t) {

}
function tomPeso(w, lingua) {
  if (!w) return 0;
  // Ganha o radical mais comprido: «fearless» é positivo, «careless» é negativo.
  let melhor = 0, tam = 0;
  for (const l of (lingua ? [lingua] : ['pt', 'en'])) {
    const L = LEX[l];

    for (const s of L.pos) if (w.startsWith(s) && s.length > tam) { tam = s.length; melhor = 1; }
  }
  return melhor;
}
function tomPalavras(t) { return t.split(/[^a-z0-9\-]+/).filter(Boolean); }
function tomContaLingua(t, l) {

  return n;

  const pt = tomContaLingua(t, 'pt') + (/\b(tu|tua|teu|es|que|de|o|a|e)\b/.test(t) ? 2 : 0);

    const textos = [D.pos[3], D.pos[1], D.pos[5], D.pos[10], D.sug[0], D.pos[13], D.pos[2], D.neg];
    textos.forEach((texto, i) => {
      const tom = classificarTom(texto).tom;
      this.msgs.push({ id: 'mu' + i + Date.now(), de: this.pessoas[i].pid, para: p.pid, texto, tom, palavrao: false, estado: tom === 'negativa' && this.s.rever ? 'pendente' : 'entregue', hora: Date.now() + i, agradecida: false });
    });
    return this.ok({ pid: p.pid, token: p.token });
  }
  async eu(c, t) {
    this.verificar(c); this.simular(); const eu = this.pessoa(t); const meus = {}, rec = {};
    for (const x of this.msgs) {
      if (x.estado === 'apagada') continue;
      if (x.de === eu.pid) (meus[x.para] ||= { papeis: [], passou: false }).papeis.push({ id: x.id, texto: x.texto, tom: x.tom, agradecida: x.agradecida });
      if (x.estado !== 'retirada') rec[x.para] = (rec[x.para] || 0) + 1;
    }
    for (const pid of eu.passou) (meus[pid] ||= { papeis: [], passou: false }).passou = true;
    const pessoas = this.pessoas.filter(p => !p.removida && p.pid !== eu.pid).sort((a, b) => (rec[a.pid] || 0) - (rec[b.pid] || 0)).map(p => ({ pid: p.pid, nome: p.nome }));
    return this.ok({ sessao: this.sessao(), eu: { pid: eu.pid, nome: eu.nome }, pessoas, meus });
  }
  async escrever(c, t, para, texto) {
    const eu = this.pessoa(t); if (this.s.fase !== 'escrita') throw this.erro(S.lingua === 'en' ? 'This isn’t the writing step.' : 'Agora não é a fase de escrever.');
    texto = String(texto || '').replace(/\s+/g, ' ').trim().slice(0, 280);
    if (texto.length < 3) throw this.erro(L.fraseCurta);
    if (this.msgs.filter(x => x.de === eu.pid && x.para === para && x.estado !== 'apagada').length >= 2) throw this.erro(S.lingua === 'en' ? 'You’ve already left two messages for this person.' : 'Já deixaste duas mensagens a esta pessoa.');
    const { tom, palavrao } = classificarTom(texto);
    const m = { id: 'm' + Date.now(), de: eu.pid, para, texto, tom, palavrao, estado: palavrao || (tom === 'negativa' && this.s.rever) ? 'pendente' : 'entregue', hora: Date.now(), agradecida: false };
    this.msgs.push(m); eu.passou = eu.passou.filter(x => x !== para);
    return this.ok({ ok: true, id: m.id, tom, estado: m.estado });
  }
  async apagar(c, t, id) { const eu = this.pessoa(t); const m = this.msgs.find(x => x.id === id && x.de === eu.pid); if (m) m.estado = 'apagada'; return this.ok({ ok: true }); }
  async passar(c, t, para) { const eu = this.pessoa(t); if (!eu.passou.includes(para)) eu.passou.push(para); return this.ok({ ok: true }); }
  async garrafa(c, t) {
    const eu = this.pessoa(t); if (!['abertura', 'fecho'].includes(this.s.fase)) throw this.erro(S.lingua === 'en' ? 'It’s not time to open yet.' : 'Ainda não é altura de abrir.', 403);
    return this.ok({ sessao: this.sessao(), eu: { pid: eu.pid, nome: eu.nome },
      mensagens: this.msgs.filter(x => x.para === eu.pid && x.estado === 'entregue').sort((a, b) => a.hora - b.hora).map(x => ({ id: x.id, texto: x.texto, tom: x.tom, agradecida: x.agradecida })) });
  }
  async agradecer(c, t, id) { const eu = this.pessoa(t); const m = this.msgs.find(x => x.id === id && x.para === eu.pid); if (m) m.agradecida = true; return this.ok({ ok: true }); }
  async progresso(c, t, lidas, total) { const eu = this.pessoa(t); eu.lidas = lidas; eu.total = total; return this.ok({ ok: true }); }
  async painel() {
    this.simular();
    return this.ok({ sessao: { ...this.sessao(), criada: this.s.criada }, pessoas: this.pessoas.filter(p => !p.removida).map(({ pid, nome, entrou, passou, lidas, total }) => ({ pid, nome, entrou, passou, lidas, total })),
      mensagens: this.msgs.filter(x => x.estado !== 'apagada') });
  }
  async fase(c, k, fase) { if (fase === 'abertura' && this.s.fase !== 'abertura') this.s.abreEm = Date.now() + 5000; if (fase !== 'escrita') this.s.escritaAte = null; this.s.fase = fase; return this.ok({ ok: true }); }
  async definicoes(c, k, d) {
    if (typeof d.rever === 'boolean') this.s.rever = d.rever; if (TEMAS_VIS[d.tema]) this.s.tema = d.tema; if (I18N[d.lingua]) this.s.lingua = d.lingua;
    if ('minutos' in d) this.s.escritaAte = d.minutos > 0 ? Date.now() + d.minutos * 60000 : null; return this.ok({ ok: true });
  }
  async moderar(c, k, id, estado) { const m = this.msgs.find(x => x.id === id); if (m) m.estado = estado; return this.ok({ ok: true }); }
  async remover(c, k, pid) { const p = this.pessoas.find(x => x.pid === pid); if (p) p.removida = true; return this.ok({ ok: true }); }
  async reentrada(c, k, pid) { const p = this.pessoas.find(x => x.pid === pid); return this.ok({ token: p ? p.token : '' }); }
  async apagarSessao() { this.reiniciar(); return this.ok({ ok: true }); }
}

// ---------------- contagem sincronizada (3, 2, 1) antes de abrir
async function contagem(ate, dentroDe) {
  if (!ate || S.contagemFeita === ate) return; S.contagemFeita = ate;
  if (ate - agoraServidor() <= 300) return;
  const raiz = dentroDe || document.body;
  const el = document.createElement('div'); el.className = 'contagem'; el.setAttribute('role', 'status');
  el.innerHTML = `${particulas(S.tema, 22, true)}<div class="c-txt"><span class="c-rot">${esc(T.q.abertura)}</span><span class="c-num" id="c-num">${L.preparem}</span></div>`;
  raiz.appendChild(el);
  let ultimo = '';
  while (true) {
    const ms = ate - agoraServidor();
    const txt = ms > 3000 ? L.preparem : ms > 0 ? String(Math.ceil(ms / 1000)) : L.ja;
    if (txt !== ultimo) {
      ultimo = txt; const n = el.querySelector('#c-num'); n.textContent = txt;
      if (!MENOS_MOV) n.animate([{ transform: 'scale(1.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 380, easing: 'cubic-bezier(.3,1.4,.5,1)' });
      if (/^\d$/.test(txt)) { Som.tocar('tic'); vibrar(30); }
    }
    if (ms <= -700) break;
    await espera(100);
  }
  Som.tocar('abrir');
  if (!MENOS_MOV) await el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' }).finished;
  el.remove();
}

      const antes = S.pd.sessao.fase;

      if (mudou || novo !== S.vista || S.pd.sessao.fase !== antes) { if (novo === 'p-abrir') S.g = null; S.vista = novo; render(); return; }
      const assin = JSON.stringify([S.pd.pessoas, S.pd.meus, S.pd.sessao.escritaAte]);

function ordemColegas() {

  const pids = S.pd.pessoas.map(p => p.pid);

// ---------------- quadro projetado
function nuvemPalavras() {
  const ent = S.fd.mensagens.filter(m => m.estado === 'entregue' && m.tom === 'positiva');
  const top = qualidadesTop(ent).slice(0, 24); if (!top.length) return '';
  const max = top[0][1]; const cores = T.nuvem;
  return `<div class="nuvem">${top.map((x, i) => [x, (i * 7) % top.length]).sort((a, b) => a[1] - b[1]).map(([[w, n]], i) => `<span style="font-size:${24 + (n / max) * 40}px;color:${cores[i % 4]}">${esc(w)}</span>`).join('')}</div>`;
}
function desenharQuadro(forcar) {
  const d = S.fd; const f = d.sessao.fase; const raiz = $('#quadro-raiz');

  raiz.dataset.assin = assin;
  const ent = d.mensagens.filter(m => m.estado === 'entregue'); const rp = resumoPessoas();
  let corpo = '';

    const tit = d.sessao.titulo && d.sessao.titulo !== 'Copo Cheio' ? ' · ' + esc(d.sessao.titulo) : '';
    corpo = `<div class="q-entrada2"><div class="q-texto">

          <li><b>2</b><span>${esc(L.passoCodigo)} <strong class="q-cod-g">${esc(S.f.codigo)}</strong></span></li>
          <li><b>3</b><span>${esc(L.passoNome)}</span></li>
        </ol>
        <div class="q-contador"><b>${d.pessoas.length}</b><span>${esc(L.entraram(d.pessoas.length))}${S.demo ? ' · ' + L.qrExemplo : ''}</span></div>
        <div class="q-nomes">${d.pessoas.map(p => `<span>${esc(p.nome)}</span>`).join('')}</div>
      </div><div class="q-qr2"><div id="qr"></div></div></div>`;
  } else if (f === 'escrita') {
    const n = d.pessoas.length; const tot = n * (n - 1) || 1;
    const feitos = rp.reduce((s, p) => s + p.escreveuPara + p.passou, 0); const ate = d.sessao.escritaAte;
    corpo = `<p class="q-sub">${esc(T.qSub.escrita)}</p>

  } else if (f === 'abertura') {

  } else {
    const pos = ent.filter(m => m.tom === 'positiva').length;
    corpo = `<p class="q-sub">${esc(T.qSub.fecho)}</p>${nuvemPalavras()}
      <div class="q-numeros" style="justify-content:center"><div><b>${ent.length}</b><span>${L.mensagens}</span></div><div><b>${d.pessoas.length}</b><span>${L.pessoas}</span></div><div><b>${ent.length ? Math.round(pos / ent.length * 100) : 0}%</b><span>${L.positivasCurto}</span></div><div><b>${ent.filter(m => m.agradecida).length}</b><span>${L.agradecidasN}</span></div></div>${cais(true)}`;
  }
  if (!raiz.querySelector('.quadro') || raiz.dataset.tema !== S.tema) {
    raiz.dataset.tema = S.tema;
    raiz.innerHTML = `<div class="quadro" role="dialog" aria-label="${esc(L.projetar)}" style="--q-acento:${ACENTO_Q[S.tema] || '#FFD66B'}">${enfeitesEpoca(S.tema)}${particulas(S.tema, S.tema === 'verao' ? 14 : 26, true)}<div id="q-conteudo"></div></div>`;
  }
  const barra = `<div class="q-topo q-barra"><span class="q-marca">${iconeTema(S.tema)}Copo Cheio · ${esc(T.nome)}</span><span class="esp"></span><span class="q-cod">${esc(S.f.codigo)}</span><button class="sair" data-a="sair-quadro">${L.fecharQ}</button></div>`;
  const fases = `<nav class="q-fases" aria-label="${esc(L.fase)}">${L.fases.map((x, i) => `<button data-a="fase-q" data-fase="${FASES_Q[i]}" aria-current="${f === FASES_Q[i]}">${esc(x[0])}</button>`).join('')}<span class="dica">${esc(L.setas)}</span></nav>`;
  $('#q-conteudo').innerHTML = barra + (f === 'entrada' ? '' : `<h2 class="q-h2">${esc(T.q[f])}</h2>`) + corpo + fases;
  if (f === 'entrada' && window.QRCode) { try { new QRCode($('#qr'), { text: linkEntrada(S.f.codigo), width: 440, height: 440, colorDark: '#0B0D1A', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
  else if (f === 'entrada') $('#qr').innerHTML = `<div style="width:260px;height:260px;display:grid;place-items:center;font-weight:600">${L.qrIndisp}</div>`;
  if (f === 'abertura' && d.sessao.abreEm > agoraServidor()) contagem(d.sessao.abreEm, raiz.querySelector('.quadro'));

// ---------------- Excel
function exportarExcel() {
  if (!window.XLSX) { toast(L.t.semExcel); return; }
  const d = S.fd; const X = L.excel; const dt = h => new Date(h).toLocaleString(L.locale);
  const msgs = [...d.mensagens].sort((a, b) => a.hora - b.hora).map(m => Object.fromEntries(X.msg.map((h, i) => [h, [dt(m.hora), nomePid(m.de), nomePid(m.para), m.texto, tomNome(m.tom), X.estados[m.estado] || m.estado, m.agradecida ? X.sim : X.nao][i]])));
  const res = resumoPessoas().map(p => Object.fromEntries(X.res.map((h, i) => [h, [p.nome, p.recebidas, p.tons.positiva || 0, p.tons.sugestao || 0, p.tons.neutra || 0, p.tons.negativa || 0, p.qualidades.join(', '), p.escreveuPara, p.papeisEscritos, p.passou, p.leuTudo ? X.sim : X.nao, p.agradeceu][i]])));
  const wb = XLSX.utils.book_new();
  const w1 = XLSX.utils.json_to_sheet(msgs.length ? msgs : [Object.fromEntries(X.msg.map(h => [h, '']))]); w1['!cols'] = [{ wch: 18 }, { wch: 20 }, { wch: 20 }, { wch: 70 }, { wch: 13 }, { wch: 22 }, { wch: 11 }];
  const w2 = XLSX.utils.json_to_sheet(res); w2['!cols'] = [{ wch: 22 }, { wch: 12 }, { wch: 10 }, { wch: 11 }, { wch: 9 }, { wch: 12 }, { wch: 34 }, { wch: 14 }, { wch: 13 }, { wch: 9 }, { wch: 10 }, { wch: 10 }];
  const w3 = XLSX.utils.aoa_to_sheet([[X.ses[0], d.sessao.titulo], [X.ses[1], S.f.codigo], [X.ses[2], T.nome], [X.ses[3], I18N[d.sessao.lingua || 'pt'].nomeLingua], [X.ses[4], dt(d.sessao.criada)], [X.ses[5], dt(Date.now())], [X.ses[6], d.pessoas.length], [X.ses[7], d.mensagens.length], [X.ses[8], d.sessao.rever ? X.sim : X.nao], [], [X.conf]]); w3['!cols'] = [{ wch: 18 }, { wch: 50 }];
  XLSX.utils.book_append_sheet(wb, w1, X.folhas[0]); XLSX.utils.book_append_sheet(wb, w2, X.folhas[1]); XLSX.utils.book_append_sheet(wb, w3, X.folhas[2]);
  const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  guardarFicheiro(`copo-cheio_${S.f.codigo}_${new Date().toISOString().slice(0, 10)}.xlsx`,
    new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

const FASES_Q = ['entrada', 'escrita', 'abertura', 'fecho'];
/* Na projeção: → avança e ← recua (também com o comando de apresentações). Antes de abrir com pessoas
   que ainda têm poucas mensagens, avisa sem dizer quem (o ecrã está projetado) e pede outra vez →. */
async function irFase(passo, alvo) {
  if (!S.f || !S.fd || S.aMudarFase) return;
  mostrarFasesQ();
  const atual = S.fd.sessao.fase, i = FASES_Q.indexOf(atual);
  const nova = alvo || FASES_Q[Math.max(0, Math.min(FASES_Q.length - 1, i + passo))];
  if (nova === atual) return;
  const pc = poucas();
  if (nova === 'abertura' && atual === 'escrita' && pc.length && S.fd.pessoas.length > 2 && !(S.confirmarAbrir && Date.now() - S.confirmarAbrir < 10000)) {
    S.confirmarAbrir = Date.now(); avisoQuadro(L.poucasN(pc.length, MIN_MSG)); return;
  }
  S.confirmarAbrir = 0; S.aMudarFase = true;
  try { await mudarFase(nova); } finally { S.aMudarFase = false; }
  document.querySelector('#quadro-raiz .q-aviso')?.remove();
  if (S.quadro) desenharQuadro(true);
}

});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'tema') { aplicarTema(t.value); return; }
  if (t.name === 'lingua') { aplicarLingua(t.value); S.linguaManual = true; const tit = $('#f-tit')?.value; vCriar(); if (tit) $('#f-tit').value = tit; return; }
  if (t.name === 'tema-def') { definir({ tema: t.value }, L.t.tema(temaDe(t.value, S.lingua).nome)); return; }
  if (t.name === 'lingua-def') { S.linguaManual = false; await definir({ lingua: t.value }); toast(L.t.lingua(I18N[t.value].nomeLingua)); return; }
  const b = t.closest('input[data-a]'); if (!b) return;
  if (b.dataset.a === 'def-autores') { S.autores = b.checked; S.assinPainel = ''; }
  if (b.dataset.a === 'def-rever') definir({ rever: b.checked }, b.checked ? L.t.reverOn : L.t.reverOff);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.quadro) fecharQuadro(); else fecharModal(); }
  const el = e.target && e.target.closest ? e.target : document.body;   /* com o foco na página, o alvo é o document */
  if (S.quadro && S.f && !el.closest('input,textarea,select')) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !el.closest('button'))) { e.preventDefault(); irFase(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); irFase(-1); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'gg') { e.preventDefault(); e.target.dataset.a === 'abrir-rec' ? abrirRecipiente() : tirarPapel(); }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return; e.preventDefault();
  const fd = new FormData(form); const erro = $('#erro'); erro.textContent = '';
  const btn = form.querySelector('[type="submit"]'); btn.disabled = true;
  try {
    if (form.dataset.form === 'entrar') {
      const codigo = String(fd.get('codigo')).trim().toUpperCase();
      const r = await S.motor.entrar(codigo, fd.get('nome'));
      S.p = { codigo, token: r.token }; if (!S.demo) ls.gravar('gam:p:' + codigo, S.p);
      S.comp = null; S.g = null; S.ordem = []; S.demoVer = 'participante'; await entrarParticipante();
    } else if (form.dataset.form === 'criar') {
      const r = await S.motor.criarSessao({ titulo: fd.get('titulo'), rever: !!fd.get('rever'), tema: fd.get('tema') || S.tema, lingua: fd.get('lingua') || S.lingua });
      S.tab = 'cais'; await abrirPainel(r.codigo, r.chave);
      toast(L.t.criada);
    } else if (form.dataset.form === 'f-entrar') {
      await abrirPainel(String(fd.get('codigo')).trim().toUpperCase(), String(fd.get('chave')).trim());
    }
  } catch (err) { erro.textContent = err.message; }
  btn.disabled = false;
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.vista === 'f-painel') atualizarPainel().catch(() => {}); });

// ---------------------------------------------------------------- arranque
(async function arrancar() {
  document.documentElement.classList.toggle('grande', S.letra);
  aplicarLingua(linguaInicial()); aplicarTema(temaDaEpoca());
  const q = new URLSearchParams(location.search);
  if (I18N[q.get('lang')]) { S.linguaManual = true; aplicarLingua(q.get('lang')); }
  let remoto = false;
  if (!q.has('demo') && /^https?:$/.test(location.protocol)) {
    try {
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 3000);
      const r = await fetch(API_BASE + '/api/ping', { signal: ctl.signal, cache: 'no-store' }); clearTimeout(t);
      const j = await r.json(); remoto = j && j.app === 'garrafas-ao-mar';
    } catch (e) { remoto = false; }
  }
  S.demo = !remoto;
  if (TEMAS_VIS[q.get('tema')]) S.temaVer = q.get('tema');
  S.motor = remoto ? new MotorRemoto() : new MotorDemo();
  const cod = (q.get('s') || '').toUpperCase();
  if (cod && remoto) {
    if (q.get('t')) ls.gravar('gam:p:' + cod, { codigo: cod, token: q.get('t') });
    history.replaceState(null, '', location.pathname + '?s=' + cod);
    const guardado = ls.ler('gam:p:' + cod, null);
    if (guardado && guardado.token) { S.p = guardado; return entrarParticipante(); }
    try { const i = await S.motor.info(cod); sincronizar(i.sessao); } catch (e) {}
    S.codPre = cod; S.vista = 'entrar'; parar(); return render();
  }
  mostrar('inicio');
})();

</script>
