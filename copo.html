<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Copo Cheio · Entrar | Juliana Araújo</title>
<script>
/* Morada curta para quem não lê o QR: com o código no endereço (?s=ABCD) segue logo para a sessão */
(function(){var c=(new URLSearchParams(location.search).get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
if(c.length===4)location.replace("https://area-reservada.jmatosaraujo99.workers.dev/copo-cheio.html?s="+c);})();
</script>
<link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tokens.css?v=20260915">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--cobalto);color:var(--creme)}
  body{font-family:var(--fonte-corpo);display:flex;flex-direction:column;min-height:100svh;padding:24px 16px}
  .topo{font-family:var(--fonte-etiqueta);font-size:12px;letter-spacing:var(--ls-etiqueta);text-transform:uppercase;color:rgba(242,239,234,.72)}
  .topo a{color:inherit;text-decoration:none}
  main{flex:1;display:grid;place-items:center;padding:32px 0}
  .caixa{width:100%;max-width:380px}
  h1{font-family:var(--fonte-display);font-weight:400;text-transform:uppercase;letter-spacing:var(--ls-display);font-size:clamp(48px,calc(10 * var(--fluido, 1vw)),80px);line-height:.95;margin:0 0 12px}
  p{margin:0 0 24px;line-height:1.5;color:rgba(242,239,234,.82)}
  label{display:block;font-family:var(--fonte-etiqueta);font-size:12px;letter-spacing:var(--ls-etiqueta);text-transform:uppercase;margin:0 0 6px;color:rgba(242,239,234,.72)}
  input{width:100%;font-family:var(--fonte-display);font-size:44px;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:10px 12px;border-radius:14px;border:1.5px solid rgba(242,239,234,.35);background:rgba(242,239,234,.08);color:var(--creme);margin:0 0 16px}
  input:focus{outline:2px solid var(--creme);outline-offset:2px;border-color:transparent}
  button{width:100%;font:600 17px var(--fonte-corpo);padding:15px;border:0;border-radius:999px;background:var(--creme);color:var(--cobalto);cursor:pointer;min-height:52px}
  .erro{min-height:1.4em;margin:12px 0 0;font-weight:600;color:#fff}
</style>
</head>
<body>
<p class="topo"><a href="index.html">Juliana Araújo</a> · Copo Cheio</p>
<main>
  <form class="caixa" id="f" novalidate>
    <h1>Copo Cheio</h1>
    <p>Escreve o código de quatro letras que está no ecrã.</p>
    <label for="c">Código da sessão</label>
    <input id="c" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" required>
    <button type="submit">Entrar</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
</main>
<script>
(function(){
  var f=document.getElementById("f"), c=document.getElementById("c"), erro=document.getElementById("erro");
  c.addEventListener("input",function(){ c.value=c.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); erro.textContent=""; });
  f.addEventListener("submit",function(ev){
    ev.preventDefault();
    if(c.value.length!==4){ erro.textContent="O código tem quatro letras ou algarismos."; c.focus(); return; }
    location.href="https://area-reservada.jmatosaraujo99.workers.dev/copo-cheio.html?s="+c.value;
  });
  c.focus();
})();
</script>
</body>
</html>
